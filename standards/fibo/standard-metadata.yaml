description: >
  The Financial Industry Business Ontology (FIBO) is the EDM Council's
  formal OWL model of the concepts of the financial industry: business
  entities and their identifiers (including the ISO 17442 Legal Entity
  Identifier), ownership and control, contracts and agreements, financial
  instruments and securities, loans, derivatives, indices and indicators,
  corporate actions, and the ACTUS contract taxonomy. It is published as
  modules (FND, BE, FBC, SEC, LOAN, DER, IND, CAE, ACTUS) with a quarterly
  Production release. The 2026Q3 Production release has 156 ontology files
  (134,232 triples) and builds on the OMG Commons Ontology Library.
