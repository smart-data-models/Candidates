matchTypes:
  skos:exactMatch: Same thing; interchangeable.
  skos:closeMatch: Same thing with a different structure; needs a transformation.
  skos:broadMatch: The SDM model is broader than the EDINT class.
  skos:narrowMatch: The SDM model is narrower than the EDINT class.
  none: 'No equivalent on the other side: a gap.'
mappings:
- id: aparcamiento-fuera-via
  label: Off-street parking
  edintClass: https://edint.es/def/aparcamiento#OffStreetParking
  candidateEntity: Parking
  candidateNote: 'parkingType: OffStreet (the candidate collapses OnStreetParking/OffStreetParking into Parking)'
  sdmModel: OffStreetParking
  sdmSubject: dataModel.Parking
  sdmSchema: https://github.com/smart-data-models/dataModel.Parking/tree/master/OffStreetParking
  match: skos:exactMatch
  note: Same concept and same name. EDINT hangs it from infraestructura#Facility; SDM treats it as an NGSI-LD entity
    that includes occupancy.
- id: aparcamiento-en-via
  label: On-street parking
  edintClass: https://edint.es/def/aparcamiento#OnStreetParking
  candidateEntity: Parking
  candidateNote: 'parkingType: OnStreet (the candidate collapses OnStreetParking/OffStreetParking into Parking)'
  sdmModel: OnStreetParking
  sdmSubject: dataModel.Parking
  sdmSchema: https://github.com/smart-data-models/dataModel.Parking/tree/master/OnStreetParking
  match: skos:exactMatch
  note: Same concept. Regulated parking zones (zona-regulatoria#RegulatedParkingZone in EDINT) fall here in SDM,
    as a category of on-street parking.
- id: plaza-aparcamiento
  label: Parking spot
  edintClass: https://edint.es/def/aparcamiento#ParkingSpot
  candidateEntity: ParkingSpot
  sdmModel: ParkingSpot
