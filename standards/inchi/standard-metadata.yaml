description: >
  The IUPAC International Chemical Identifier (InChI) is an open,
  structure-based textual identifier for chemical substances, developed by
  IUPAC and maintained by the InChI Trust. An InChI is computed from a
  chemical structure (connection table) by normalization,
  canonicalization and serialization, and is written as a version prefix
  followed by layers: chemical formula, connections, hydrogen atoms
  (including mobile H), charge and protons, stereochemistry, isotopes,
  fixed H and reconnected metals. The InChIKey is its fixed-length
  (27-character) hashed form, used for database indexing and web search.
  InChI is used by the major chemical databases (PubChem, ChEBI, ChEMBL,
  ChemSpider, Wikidata, ...), regulatory chemical registries and
  chemistry software.
