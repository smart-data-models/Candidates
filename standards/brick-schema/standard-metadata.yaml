title: "Brick Schema"
publisher: "Brick Consortium (UC Berkeley, with industry and academic contributors); ontology hosted at ontology.brickschema.org"
sourceUrl: "https://github.com/BrickSchema/Brick"
sourceOntologyVersion: "v1.4.4 (released 2025-05-02)"
sourceOntologyDownload: "https://github.com/BrickSchema/Brick/releases/download/v1.4.4/Brick.ttl"
sourceExampleUrl: "https://github.com/BrickSchema/Brick/tree/master/examples/iaq_sensor_deployment"
domains:
  - Smart-Sensoring
  - SmartCities
description: >
  Uniform metadata schema for buildings: a vocabulary for describing the
  points (sensors, setpoints, commands, statuses, alarms), equipment (AHUs,
  chillers, pumps, VAVs, network devices, etc.), and their relationships
  (hasPoint/isPointOf, hasPart/isPartOf, feeds/isFedBy, hasUnit via QUDT) in
  building automation and IoT deployments. Widely used in the building
  controls / smart buildings community.
license: "BSD-3-Clause"
licenseNote: >
  Unlike the two EDINT candidates and unresolved for the Madrid accidents
  candidate, this source has a clean, unambiguous, permissive license --
  both the GitHub repository and the ontology file's own dcterms:license
  statement confirm BSD-3-Clause. No ShareAlike or unstated-license concerns
  here.
contributors:
  - name: "Claude (sdm-translate skill)"
    role: "automated translation from source ontology to SDM candidate artifacts"
notes: |
  Translated on 2026-07-31 from Brick v1.4.4 (1,518 classes total: 1,431 in
  the core Brick namespace, 80 in BrickShape, 5 in Brick/ref), grounded in
  the real example at examples/iaq_sensor_deployment/iaq_sensor_deployment.ttl
  (a residential indoor air quality monitoring deployment) in the source repo.

  SCALE AND MODELING STRATEGY: Brick's ~1,500 classes are overwhelmingly a
  classification taxonomy, not ~1,500 distinct rich schemas -- 937 of them
  are Point subclasses (specific sensor/setpoint/command/status/alarm types)
  and 331 are Equipment subclasses (specific device types), each typically
  carrying only the same small set of structural relationships (hasPoint,
  isPointOf, hasUnit, hasPart, feeds, ...). Per explicit instruction, this
  candidate therefore models exactly two generic entity types -- Point and
  Equipment -- with the specific Brick class captured as a `brickClass`
  Relationship attribute, rather than instantiating hundreds of separate
  NGSI-LD entity types. This mirrors how this session has handled other
  large controlled vocabularies (e.g. InfrastructureType, AccommodationRateType
  in the earlier EDINT candidates).

  UPDATE 2026-07-31 (second pass): added Collection and System as thin
  placeholder entities (brickClass only, no members) and Equipment.isFedBy.
  Location remains fully out of scope -- see below, the reason turned out to
  be stronger than originally thought.

  LOCATION IS DEPRECATED IN THE SOURCE ONTOLOGY ITSELF, NOT JUST
  REC-DEPENDENT IN PRACTICE: checked directly against Brick.ttl v1.4.4 after
  being asked to verify. `brick:Location` and `brick:Space` (and by
  inheritance the ~108 classes under them -- Room, Building, Floor, Site,
  Zone, Storey, Wing, Outdoor_Area, Outside, Region, etc.) all carry
  `owl:deprecated true`, `deprecatedInVersion "1.4.0"`, and an explicit
  `deprecationMitigationMessage`: "Brick location classes are being phased
  out in favor of RealEstateCore classes." `brick:Location isReplacedBy
  rec:Architecture`; `brick:Space isReplacedBy rec:Space`. 185 classes are
  marked deprecated in the whole Brick namespace; the Location branch
  accounts for the large majority of them. None of Point, Equipment,
  Collection, System, or any of the specific leaf classes used anywhere in
  this candidate (CO2_Level_Sensor, Rooftop_Unit, Automation_Collection,
  HVAC_System, the chiller-plant classes, etc.) are deprecated -- checked
  individually. Modeling Location now, even from clean real example data
  (examples/simple_apartment/apartment.ttl has real, pure-Brick Room/
  Apartment/HVAC_Zone/Lighting_Zone/isPartOf usage with no REC dependency),
  would mean publishing a schema for something the ontology's own
  maintainers are actively retiring. Left for the planned RealEstateCore
  candidate, which is the ontology's own stated replacement path, not
  merely this session's preference.

  COLLECTION AND SYSTEM ARE PUBLISHED INCOMPLETE, ON PURPOSE: neither class
  is deprecated, but neither has a Brick-native membership property either.
  Checked three real examples spanning two different domains
  (examples/collection/collection.ttl, examples/chiller-system/chiller-plant.ttl,
  examples/iaq_sensor_deployment) and every single Collection/System instance
  in all three uses RealEstateCore's rec:includes (or, per Brick's own SHACL
  shapes, its alternative rec:hasMember) for membership -- never a Brick
  property. One of Brick's own example files (collection.ttl) comments on
  this directly: "collection includes point, equip" via rec:includes, with
  no Brick alternative offered. Per explicit instruction, Collection and
  System are still published now (brickClass + identity only, no members)
  rather than withheld entirely, so the entity types exist in the repository
  already -- but they cannot do their one real job (grouping) until the
  planned RealEstateCore candidate gives them something to point a
  membership Relationship at.

  EQUIPMENT.isFedBy ADDED: the documented inverse of feeds, confirmed with
  real, rich, reciprocal usage in examples/chiller-system/chiller-plant.ttl
  (e.g. a Chiller isFedBy several Chilled_Water_Pump and Condenser_Water_Pump
  instances) -- a different real example than the one this candidate's own
  Equipment.examples/example.json is drawn from, since the rtu (Rooftop_Unit)
  instance used there is upstream in its air-chain and has nothing feeding
  it. The property is documented on the schema; the example.json instance
  was intentionally left unchanged rather than swapped to a chiller instance,
  to avoid fragmenting this candidate's examples across two unrelated
  deployment scenarios (residential IAQ vs. a commercial chiller plant) for
  the sake of one optional property.

  REAL DISCREPANCIES FOUND BETWEEN THE CHOSEN EXAMPLE AND THE RELEASED
  ONTOLOGY (v1.4.4), resolved in favour of the released, authoritative
  ontology terms (the reverse of this session's usual default, because here
  the "real data" file uses invalid/nonexistent terms, not just differently
  granular real ones):
    - The example uses `brick:hosts` (and its claimed inverse
      `brick:isHostedBy`) on IAQ_Sensor_Equipment instances for the
      equipment-to-point relationship. Neither term exists anywhere in the
      released Brick v1.4.4 ontology. The same example file correctly uses
      `brick:hasPoint` for the identical relationship on other equipment
      (Rooftop_Unit, Filter, Space_Heater, Exhaust_Fan, Thermostat,
      Controller) a few dozen lines later -- an internal inconsistency
      within the example itself. This candidate's Equipment.hasPoint uses
      the valid, real `hasPoint` term throughout.
    - The example uses `brick:isControlledBy` (Exhaust_Fan controlled by a
      Controller). This term does not exist in the released ontology either
      (checked as ObjectProperty, DatatypeProperty, and generic rdf:Property
      -- no match under any declaration). Not included in this candidate;
      no valid substitute was identified. Worth raising with the Brick
      maintainers, or checking a more recent unreleased ontology version.
    - `brick:value` (used inside the `brick:resolution` blank node) IS valid,
      just declared as a generic `rdf:Property` rather than an OWL
      Datatype/ObjectProperty -- easy to miss with a type-filtered query;
      noted here in case it trips up anyone else inspecting this ontology
      programmatically.

  DUPLICATION RISK: real and significant, deliberately not checked in
  detail before this translation (per explicit instruction, consistent with
  this session's established default). Smart Data Models already has an
  official dataModel.Device subject (Device, DeviceMeasurement, DeviceModel,
  Camera, Modbus, ...) under the Smart-Sensoring domain, and a
  dataModel.Building subject (Building, BuildingOperation, BuildingType,
  ...) under SmartCities. Brick's Equipment and Point map fairly directly
  onto Device/DeviceMeasurement conceptually; Brick's (out-of-scope-here)
  Location branch would likely map onto Building. This should be the first
  thing checked before promoting this candidate.

  GEOMETRY / SPATIAL DATA: out of scope for this pass -- Point and Equipment
  carry no direct location coordinates in Brick's own model (spatial
  position, when present at all in real deployments, comes from the
  REC-modeled Location/Room, deferred per above).
