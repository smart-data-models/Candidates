specificationUrl: "https://emmo-repo.github.io/"
contact: "emmo@emmc.eu (issues: https://github.com/emmo-repo/EMMO/issues)"
sourceOntologyVersion: "1.0.4 (owl:versionIRI https://w3id.org/emmo/1.0.4/emmo), repository master at commit ad9b707 (2026-11-05)"
sourceOntologyDownload: "https://github.com/emmo-repo/EMMO (Turtle modules, top module emmo.ttl)"
sourceOntologyNamespace: "https://w3id.org/emmo#"
sourceOntologyFormat: "OWL 2 DL ontology in Turtle, split into foundation, perspectives, reference and disciplines modules"
domains:
  - Manufacturing
  - CrossSector
description: >
  EMMO is the top-level and mid-level ontology of the European Materials
  Modelling Council for applied sciences, materials and manufacturing. It
  rests on a mereocausal foundation (parthood and causation), a set of
  perspectives (holistic, reductionistic, semiotic, ...) and discipline
  modules for metrology (ISQ quantities and units), chemistry, materials,
  manufacturing (process classes following DIN 8580), conformity
  assessment and data. Version 1.0.4 has 1,849 classes, 221 object
  properties, 27 datatype properties and 1,623 named individuals (mostly
  measurement units). It is the base of the EMMO domain ontologies
  (BattINFO, characterisation, mechanical testing, ...) used in EU
  materials and manufacturing projects.
