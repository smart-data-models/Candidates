description: >
  ERATV is one of four registers (alongside RINF, ERADIS, EVR) published
  under the single ERA Ontology v3.3.3 -- see the era-rinf candidate's
  standard-metadata.yaml for the shared ontology-wide context. ERATV itself covers authorised
  railway VEHICLE TYPES (as opposed to EVR, which registers individual
  vehicles): the vehicle type's technical characteristics (dimensions, mass,
  braking performance, gauging, ETCS/GSM-R/ATO on-board equipment, noise,
  energy supply compatibility, ...), its per-configuration variants
  (VehicleTypeConfiguration / VehicleTypeConfigParameterSet, since a single
  type can be authorised in several technical configurations, e.g. different
  energy supply systems or ETCS on-board versions), and the type-authorisation
  process itself (VehicleTypeAuthorisation, its Application, Case, compliance
  Check, and Restriction).
