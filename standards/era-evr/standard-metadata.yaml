description: >
  EVR is the last of the four registers (alongside RINF, ERATV, ERADIS)
  published under the single ERA Ontology v3.3.3 -- see era-rinf's
  standard-metadata.yaml for the shared ontology-wide context. EVR registers
  individual VEHICLES (as opposed to ERATV, which authorises vehicle TYPES):
  each vehicle's identity and technical data as manufactured (European
  Vehicle Number, keeper, owner, ECM, manufacturing details), its Vehicle
  Keeper Marking (VKM), national-level registration properties defined by
  individual member states, and the registration process itself
  (VehicleRegistration, its Application, Case, compliance Check, and
  Restriction) plus the closely related vehicle (not vehicle-type)
  authorisation-for-placing-in-service process (VehicleAuthorisation, Case,
  Notification).
