description: >
  Catena-X is the automotive data space. Its semantic models are SAMM
  (Semantic Aspect Meta Model) aspect models: each one describes one aspect
  of a digital twin, and a twin is identified by its globalAssetId (formerly
  catenaXId). This candidate covers the Industry Core, the set of aspects
  that every Catena-X traceability use case builds on: the twin itself
  (SerialPart, Batch, JustInSequencePart for instances; PartType for part
  types) and the single-level relations between twins (bill of material
  and usage, as built and as planned).
license: "CC-BY-4.0"
