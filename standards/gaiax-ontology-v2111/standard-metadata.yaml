title: "Gaia-X Ontology (Trust Framework / Self-Description Schema)"
publisher: "Gaia-X European Association for Data and Cloud AISBL (Gaia-X AISBL)"
sourceUrl: "https://docs.gaia-x.eu/ontology/v2111/classes/"
sourceOntologyVersion: "v2111"
domains:
  - CrossSector
  - CloudComputing
  - DataSpaces
description: >
  The Gaia-X ontology defines the vocabulary used to write Self-Descriptions
  (verifiable-credential-based claims) for participants, resources and
  service offerings in a Gaia-X data space / federated cloud ecosystem. It
  spans infrastructure and service-offering classes (compute, storage,
  network, container/function-as-a-service, data products), physical and
  virtual resource classes (CPU, GPU, Memory, Disk, Datacenter, Device,
  ServerFlavor), connectivity and QoS metrics (Latency, Jitter, PacketLoss,
  Throughput, BandWidth, RoundTripTime), and a large body of governance,
  legal, compliance, security-policy and credential/trust-anchor classes
  (LegalPerson, TermsAndConditions, DataUsageAgreement, InformationSecurity
  Policies, LabelCredential, EvidenceTemplate, ...) that describe how a
  participant or resource is governed and certified rather than what it
  physically measures. This candidate translates the full v2111 class list
  (165 classes) into one candidate per class under models/.
license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
licenseNote: >
  Gaia-X publications (including the ontology/schema documents) are
