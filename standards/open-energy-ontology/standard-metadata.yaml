title: "Open Energy Ontology (OEO)"
publisher: "Open Energy Family / Open Energy Platform community (OEO maintainers, incl. contributors from Reiner Lemoine Institut, Öko-Institut, DLR, OVGU Magdeburg and others); published at openenergyplatform.org"
sourceUrl: "https://github.com/OpenEnergyPlatform/ontology"
specificationUrl: "https://openenergyplatform.org/ontology/"
contact: "https://github.com/OpenEnergyPlatform/ontology/issues"
sourceOntologyVersion: "v2.14.0 (released 2026-10-08)"
sourceOntologyDownload: "https://github.com/OpenEnergyPlatform/ontology/releases/download/v2.14.0/oeo-full.owl"
sourceOntologyNamespace: "https://openenergyplatform.org/ontology/oeo/"
sourceExampleUrl: "https://data.open-power-system-data.org/conventional_power_plants/latest/conventional_power_plants_DE.csv"
