title: "SAREF4AGRI"
publisher: "ETSI"
sourceUrl: "https://saref.etsi.org/saref4agri/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
normativeReference: "ETSI TS 103 410-6 V2.1.1 (2024-10), SmartM2M; Extension to SAREF; Part 6: Smart Agriculture and Food Chain Domain"
normativeReferenceUrl: "https://www.etsi.org/deliver/etsi_ts/103400_103499/10341006/02.01.01_60/ts_10341006v020101p.pdf"
domains:
  - Agrifood
  - PrecisionAgriculture
  - LivestockFarming
  - SmartIrrigation
description: >
  SAREF4AGRI is an extension of the ETSI SAREF (Smart Applications REFerence)
  ontology for the agriculture and food chain domain, developed by ETSI
  SmartM2M (originally STF 534, revised under STF 641) and published as
  ETSI TS 103 410-6. It connects SAREF's generic Device/Sensor/Actuator and
  FeatureOfInterest/Property/Observation patterns with existing
  standardization efforts in the AgriFood domain (ICAR for livestock data,
  AEF for agricultural equipment, the Plant Ontology, AgGateway), reusing
  W3C SSN/SOSA (System, Deployment, Platform), GeoSPARQL (Feature,
  Geometry, sfContains/sfWithin topology), the TIME ontology (temporal
  intervals for deployments), the TAXRANK taxonomy vocabulary (animal/crop
  species classification) and FOAF (Person/Organization) vocabularies. The
  ontology is illustrated in the normative TS through two worked examples:
  livestock farming (farm, farm holding, farmer, animals, animal groups,
  parcels, crops, milking/eating-activity sensors) and smart irrigation
  (deployments, platforms, soil tensiometers, pluviometers). This candidate
  translates the full v2.1.1 class list (21 classes) plus the ten
  saref:Property named individuals it defines (AirTemperature,
  AmbientHumidity, Area, Intake, IrrigationWater, PlantGrowthStage,
  Precipitation, SoilMoisture, SoilTemperature, Yield) into one candidate
  model per class under models/.
