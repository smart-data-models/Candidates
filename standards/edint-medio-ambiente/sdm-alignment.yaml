edintVersions:
  candidateTranslatedFrom:
    iri: http://vocab.linkeddata.es/datosabiertos/def/medioambiente/
    version: 0.1.0
  alignedWith:
    iri: https://edint.es/def/medio-ambiente
    version: 0.2.1
  note: This candidate was translated from EDINT 0.1.0 (http://vocab.linkeddata.es/datosabiertos/def/medioambiente/).
