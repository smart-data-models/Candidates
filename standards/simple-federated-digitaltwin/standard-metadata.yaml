title: "Digital Twin extensions to the Federated ontology for SIMPLE"
publisher: "Ontology Engineering Group (OEG), Universidad Politécnica de Madrid -- ontology created in the context of the EU SIMPLE project; extends the FEDeRATED project's DigitalTwin ontology (TNO)"
sourceUrl: "https://vocab.plataformasimple.es/def/logistics/federated/DigitalTwin"
sourceOntologyVersion: "v0.3.0 (issued 2022-07-03)"
sourceOntologyDownload: "https://vocab.plataformasimple.es/def/logistics/federated/DigitalTwin/ontology.ttl"
sourceExampleUrl: "https://vocab.plataformasimple.es/def/logistics/federated/DigitalTwin"
domains:
  - Transportation
  - SmartCities
description: >
  Extensions to the FEDeRATED project's DigitalTwin ontology, created for the
  SIMPLE project. Adds a single new class, CMR (the international road
  freight consignment note / "carta de porte"), as a subclass of the base
  ontology's Document class, and a relatedDocumentation property linking a
  BusinessTransaction to a Document.
license: "Creative Commons Attribution 4.0 (CC BY 4.0), per the ontology's own dcterms:license"
licenseNote: >
  The SIMPLE extension document states CC BY 4.0 explicitly. The imported
  base FEDeRATED DigitalTwin ontology (TNO, federatedplatforms/FEDeRATED-Semantic-Model
  on GitHub) is publicly hosted but its own repository LICENSE was not
  checked here.
contributors:
  - name: "Claude (sdm-translate skill)"
    role: "automated translation from source ontology to SDM candidate artifacts"
notes: |
  Translated on 2026-09-25 from two ontology documents, same two-document
  approach used for this session's simple-federated-businessservice
  candidate:

  1. https://vocab.plataformasimple.es/def/logistics/federated/DigitalTwin
     (fetched as ontology.ttl via the doc's own host) -- the SIMPLE
     project's extension, v0.3.0. It owl:imports the FEDeRATED base
     DigitalTwin ontology and asserts exactly ONE new class (CMR) and ONE
     new object property (relatedDocumentation, domain
     BusinessService:BusinessTransaction, range DigitalTwin:Document).
     Unlike BusinessService, this SIMPLE extension is very small.

  2. https://ontology.tno.nl/logistics/federated/DigitalTwin (the base
     FEDeRATED ontology this document imports) -- UNLIKE BusinessService's
     base ontology, this one was NOT removed in the FEDeRATED-Semantic-Model
     repository's 2023-11-10 "revamp" commit: DigitalTwin.ttl still exists
     on the current master branch (fetched fresh from
     raw.githubusercontent.com/federatedplatforms/FEDeRATED-Semantic-Model/master/DigitalTwin.ttl,
     ~80 classes). No dead-link recovery was needed here.

  SCOPE: exactly 1 entity modeled -- CMR -- since that is the only class the
  SIMPLE document itself defines. relatedDocumentation is NOT modeled as an
  attribute of CMR: its domain is BusinessTransaction, not CMR/Document (CMR
  is the property's RANGE, the target being pointed at, not the source), and
  BusinessTransaction is a class this session already published separately
  in standards/simple-federated-businessservice (its Consignment and 5 Order
  subclasses flatten BusinessTransaction's properties). CROSS-CUTTING NOTE,
  not acted on here (out of scope of this candidate, flagged for whoever
  reviews both PRs together): relatedDocumentation is a genuine addition to
  BusinessTransaction that was not yet known when
  simple-federated-businessservice was translated (that translation covered
  BusinessService.ttl and its own base ontology only, not DigitalTwin.ttl) --
  Consignment/CargoHandlingOrder/DischargeOrder/GateInOrder/GateOutOrder/
  ShuntingOrder in that candidate could reasonably gain a
  relatedDocumentation Relationship attribute (-> this candidate's CMR, or
  any other Document subtype) in a future revision.

  CMR'S FLATTENED ATTRIBUTE SET -- A DELIBERATE JUDGMENT CALL: CMR ⊂
  Document ⊂ LogisticsObject in the base ontology. Document's own properties
  (documentID, documentVersion, hasDocumentType, hasMRN_Number) are
  flattened in full. LogisticsObject's own properties are NOT flattened in
  full, even though RDFS domain inheritance formally permits every one of
  them on any LogisticsObject instance including Document/CMR: LogisticsObject
  is evidently used in the base ontology as a shared root for both physical
  cargo objects (Goods, Package, Equipment, Container, ...) AND documents,
  and roughly two-thirds of its ~20 own properties are unambiguously
  physical-cargo-only in intent (netMass, hazardousMaterialDetail,
  typeOfCargo, natureOfCargo, properShippingName, packageLevelType,
  quantity, quantityType, size, damageRemarks, harmonizedSystemCode,
  hasFlashpointTemperature, hasWeight, LogisticsObjectMaxSize,
  LogisticsObjectMinimumSize, and the LogisticsObjectMaximumTemperature/
  MinimumTemperature/Temperature/Volume family) -- a CMR consignment note
  does not itself have a net mass or a hazardous-material detail in the
  ontology's evident intent, even though nothing stops an RDFS reasoner from
  accepting that assertion. Only the identity-shaped subset that plausibly
  describes a document as a LogisticsObject was kept: name, country, UUID,
  hasExternalIdentifier. This is a judgment call, not a formal exclusion --
  a reviewer who wants strict full inheritance should add the remaining
  ~15 LogisticsObject properties back.

  RELATIONSHIP TARGETS OUTSIDE THIS CANDIDATE'S SCOPE: hasExternalIdentifier
  -> DigitalTwin:ExternalIdentifier (base ontology, has its own
  externalIdentifierDescription/externalIdentifierValue properties, not
  modeled here -- out of scope, same treatment as other out-of-scope base
  classes in simple-federated-businessservice).

  EXAMPLE DATA: no real instance data was published alongside either source
  document. example.json values are synthetic, built from the real class
  and property definitions in the two source documents, in a road-freight
  scenario consistent with the ontology's own stated use case.
