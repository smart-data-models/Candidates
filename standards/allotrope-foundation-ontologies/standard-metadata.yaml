  an additional dct:license <voc/iupac-license> ("Reproduced by permission
  of International Union of Pure and Applied Chemistry"); the definitions
  of those terms (here: 'assay result') are NOT copied into this candidate,
  only their names and IRIs. The ontologies are publicly downloadable
  without login from the Allotrope PURL service; BioPortal (API key) was not
  used. The Allotrope Data Format (ADF) specification and libraries and the
  ASM schemas have their own licence terms and are NOT part of this
  candidate, which is why the source sheet marks the licence as "Partial".
