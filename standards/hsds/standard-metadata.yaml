description: >
  The Human Services Data Specification (HSDS, also called "the Open
  Referral format") is an exchange format for publishing machine-readable
  directory data about health, human and social services (food assistance,
  job training, child care, counselling, ...): the services themselves,
  the organizations that provide them and the locations where they are
  delivered, with their contacts, phones, schedules, service areas,
  eligibility, fees, languages, accessibility and taxonomy terms. It is
  used by governments, 211 / information-and-referral providers and
  community organizations to publish community resource directories as
  open data, and comes with an API specification and a tabular (CSV Data
  Package) serialization.
