title: "SAREF4WATR"
publisher: "ETSI"
sourceUrl: "https://saref.etsi.org/saref4watr/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
normativeReference: "ETSI TS 103 410-10 V2.1.1, https://www.etsi.org/deliver/etsi_ts/103400_103499/10341010/02.01.01_60/ts_10341010v020101p.pdf"
domains:
  - WaterManagement
  - SmartMetering
  - Infrastructure
  - Environment
description: >
  SAREF4WATR is the SAREF (Smart Applications REFerence ontology) extension
  for the water domain, developed by ETSI Specialist Task Force (STF) 566 and
  published as ETSI TS 103 410-10. It extends SAREF core (and reuses
  SAREF4SYST and SAREF4CITY) with a taxonomy of natural water bodies (Aquifer,
  Estuary, Glacier, Lagoon, Lake, Ocean, River, Sea), the generic Water
  feature-of-interest, water infrastructure (WaterInfrastructure and its
  subclasses DistributionSystem, StorageInfrastructure, MonitoringInfrastructure,
  GaugingStation, TreatmentPlant, HydroelectricPowerPlant), physical water
  assets (WaterAsset and its SinkAsset/SourceAsset/StorageAsset/TransportAsset/
  WaterDevice branches: Channel, FireHydrant, Intake, Main, Manhole, Pipe, Pit,
  Pump, Reservoir, Tank, Valve, Vent), a water meter and tariff model
  (WaterMeter, Tariff, ConsumptionBasedTariff, ThresholdBasedTariff,
  TimeBasedTariff), and a set of property-grouping/controlled-vocabulary
  classes for water-quality, meter and flow measurements (AcceptabilityProperty,
  BacterialProperty, ChemicalProperty, EnvironmentalProperty, MicrobialProperty,
  WaterFlowProperty, WaterMeterProperty, WaterProperty, WaterKind, WaterUse).
  This candidate translates the full v2.1.1 class list (49 OWL classes) into
  one candidate model per class under models/.
