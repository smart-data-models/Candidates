title: "Logistic Roles extensions to the Federated ontology for SIMPLE"
publisher: "Ontology Engineering Group (OEG), Universidad Politécnica de Madrid -- ontology created in the context of the EU SIMPLE project; extends the FEDeRATED project's Logistic Roles ontology (TNO)"
sourceUrl: "https://vocab.plataformasimple.es/def/logistics/federated/LogisticRoles"
sourceOntologyVersion: "v0.3.0 (issued 2022-07-03)"
sourceOntologyDownload: "https://vocab.plataformasimple.es/def/logistics/federated/LogisticRoles/ontology.ttl"
sourceExampleUrl: "https://vocab.plataformasimple.es/def/logistics/federated/LogisticRoles"
domains:
  - Transportation
  - SmartCities
description: >
  Extensions to the FEDeRATED project's Logistic Roles ontology, created for
  the SIMPLE project. Unlike the sibling simple-federated-businessservice
  candidate (which owl:imports its FEDeRATED base ontology externally), this
  document is fully self-contained: it republishes the entire base FEDeRATED
  LogisticRoles taxonomy inline, under the base ontology's own
  ontology.tno.nl namespace, and adds exactly one new class of its own
  (simple-lr:Driver) plus two property redeclarations (:involves, :isAbout).
  The taxonomy covers two distinct role hierarchies: ActorRoles (roles a
  legal person can play in a business transaction -- Carrier, Consignee,
  Forwarder, etc.) and LocationRoles (roles a physical location can play in
  the context of a specific transport means and event -- PortOfLoading,
  PlaceOfDelivery, GateInLocation, etc.).
license: "Creative Commons Attribution 4.0 (CC BY 4.0), per the ontology's own dcterms:license"
licenseNote: >
  Stated explicitly and unambiguously in the ontology's own metadata
  (dcterms:license on the ontology resource). No separate base-ontology
  license concern here, unlike simple-federated-businessservice, since this
  document does not import an external base ontology -- it republishes the
  relevant base content inline under its own CC BY 4.0 statement.
