description: >
  The Platform MaterialDigital Core Ontology (PMDco) is a mid-level
  ontology for materials science and engineering, built on the Basic
  Formal Ontology (BFO) and reusing RO, IAO, OBI and COB. It follows the
  processing - structure - properties paradigm: manufacturing,
  characterisation (assay) and simulation processes; materials, portions
  of matter, objects and devices; and material properties and qualities
  with their value specifications. It is the common semantic basis of the
  German MaterialDigital initiative and of its application ontologies
  (tensile test, hardness test, ...). Release 3.1.2 (full) has 1,426
  classes (1,191 in the PMDco namespace), 112 object properties and 9
  datatype properties.
