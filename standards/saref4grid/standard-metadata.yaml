title: "SAREF4GRID"
publisher: "ETSI"
sourceUrl: "https://saref.etsi.org/saref4grid/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
normativeReference: "ETSI TS 103 410-12 V1.1.1 (2023-11): SmartM2M; Extension to SAREF; Part 12: Smart Grid Domain, https://www.etsi.org/deliver/etsi_ts/103400_103499/10341012/01.01.01_60/ts_10341012v010101p.pdf"
domains:
  - SmartGrid
  - EnergyMetering
  - Energy
description: >
  SAREF4GRID is the SAREF (Smart Appliances REFerence ontology) extension for
  the smart grid domain, developed to describe smart electricity meters and
  the data/services they expose, explicitly aligned with DLMS/COSEM
  (IEC 62056) so that SAREF4GRID classes map cleanly onto real COSEM objects
  identified by OBIS codes. It covers: the core metering device (GridMeter,
  a subclass of saref:Meter) and its device-management components (Firmware,
  NetworkInterface, Clock with timezone/daylight-saving handling,
  BreakerState for remote connect/disconnect); tariff and billing automation
  (ActivityCalendar, SeasonProfile, DayProfile/RegularDayProfile/
  SpecialDayProfile, DaySchedule, SpecialDayEntry, PresetAdjustingTime,
  ScriptTable, Script, SingleScheduledAction); generic data capture
  (ProfileGeneric, aligned with COSEM "profile generic" objects); power-line
  and meter measurement property kinds (EnergyAndPowerProperty,
  QualityProperty, MeterProperty -- each populated, in the source ontology,
  by a controlled set of named individuals such as ActiveEnergy, Voltage,
  Current, ReactivePower, DemandRegister, PowerLimit, and modelled here via a
  propertyType enum plus a SKOS-style broaderPropertyType field -- and
  PowerLine, the saref:FeatureOfInterest these properties are properties
  of); and the remote COSEM read/write/action service machinery (GetService,
  SetService, ActionService and their GetOperation/SetOperation/
  ActionOperation, each with typed CosemOperationInput/GetOperationOutput
  subclasses and SelectiveAccess subclasses EntryDescriptor/RangeDescriptor).
  40 own SAREF4GRID classes are translated; saref core classes it imports
  and subclasses (saref:Meter, saref:Service, saref:Operation, saref:State,
  saref:Property, saref:Function, saref:FeatureOfInterest, saref:PropertyValue,
  saref:Observation) and oneM2M classes it reuses (Device, Service,
  OperationInput, OperationOutput) are referenced in descriptions but not
  re-modelled as their own candidates here, since they belong to SAREF core /
  oneM2M, not to this extension.
license: "ETSI Forge Software License (https://forge.etsi.org/etsi-software-license), per the ontology's own dcterms:license statement"
licenseNote: >
  The ontology file's own metadata (dcterms:license) points to the ETSI
