description: >
  DCSA, the association of the major container carriers, publishes open
  digital standards for container shipping (Track & Trace, Booking,
  electronic Bill of Lading, Operational Vessel Schedules, Commercial
  Schedules, Just-in-Time Port Call, ...). Track & Trace defines the
  events that carriers publish about a container shipment: shipment events
  (status of a booking or transport document), transport events (arrival
  and departure of a vessel, barge, rail or truck at a transport call) and
  equipment events (gate in/out, loading, discharge, stuffing, stripping
  and inspection of a container). It is offered as a polling and
  subscription (push) API and is implemented by the major ocean carriers.
