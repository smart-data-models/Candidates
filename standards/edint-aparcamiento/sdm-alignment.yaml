  sdmSchema: https://github.com/smart-data-models/dataModel.Parking/tree/master/ParkingSpot
  match: skos:exactMatch
  note: A single parking spot, usually with a presence sensor.
- id: grupo-plazas
  label: Group of spots by vehicle type
  edintClass: https://edint.es/def/aparcamiento#ParkingSpotsByVehicleType
  candidateEntity: ParkingSpotsByVehicleType
  sdmModel: ParkingGroup
  sdmSubject: dataModel.Parking
  sdmSchema: https://github.com/smart-data-models/dataModel.Parking/tree/master/ParkingGroup
  match: skos:broadMatch
  note: SDM groups spots by any criterion (vehicle, permit, floor); EDINT splits by vehicle type and by permit type
