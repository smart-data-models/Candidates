    the namespace used for edintClass below.
matchTypes:
  skos:exactMatch: Same thing; interchangeable.
  skos:closeMatch: Same thing with a different structure; needs a transformation.
  skos:broadMatch: The SDM model is broader than the EDINT class.
  skos:narrowMatch: The SDM model is narrower than the EDINT class.
  none: 'No equivalent on the other side: a gap.'
mappings:
- id: calidad-aire
  label: Air quality observation
  edintClass: https://edint.es/def/medio-ambiente#EnvironmentalObservation
  edintSensorType: https://edint.es/kos/SensorTypes/AirQualitySensor
  candidateEntity: EnvironmentalObservation
  sdmModel: AirQualityObserved
  sdmSubject: dataModel.Environment
  sdmSchema: https://github.com/smart-data-models/dataModel.Environment/tree/master/AirQualityObserved
  match: skos:closeMatch
  note: EDINT has a single observation class and distinguishes by sensor type; SDM has one model per topic with
    all pollutants in the same entity.
- id: ruido
  label: Noise observation
  edintClass: https://edint.es/def/medio-ambiente#EnvironmentalObservation
  edintSensorType: https://edint.es/kos/SensorTypes/NoiseSensor
  candidateEntity: EnvironmentalObservation
  sdmModel: NoiseLevelObserved
  sdmSubject: dataModel.Environment
  sdmSchema: https://github.com/smart-data-models/dataModel.Environment/tree/master/NoiseLevelObserved
  match: skos:closeMatch
  note: Same structural difference as for air quality.
- id: meteorologia-observada
  label: Observed weather
  edintClass: https://edint.es/def/medio-ambiente#EnvironmentalObservation
  edintSensorType: https://edint.es/kos/SensorTypes/ClimaticSensor
  candidateEntity: EnvironmentalObservation
  sdmModel: WeatherObserved
  sdmSubject: dataModel.Weather
  sdmSchema: https://github.com/smart-data-models/dataModel.Weather/tree/master/WeatherObserved
  match: skos:closeMatch
  note: 'EDINT''s climatology case adds no classes: it applies the environmental observation with a climatic sensor.
    SDM models it as WeatherObserved.'
- id: meteorologia-historica
  label: Historical weather series
  edintClass: https://edint.es/def/medio-ambiente#EnvironmentalObservation
  edintSensorType: https://edint.es/kos/SensorTypes/ClimaticSensor
  candidateEntity: EnvironmentalObservation
  sdmModel: WeatherObserved
  sdmSubject: dataModel.Weather
  sdmSchema: https://github.com/smart-data-models/dataModel.Weather/tree/master/WeatherObserved
  match: skos:closeMatch
  note: 'A historical series is past observations: the same model on both sides.'
gaps:
- id: prediccion-meteorologica
  label: Weather forecast
  sdmModel: WeatherForecast
  sdmSubject: dataModel.Weather
  sdmSchema: https://github.com/smart-data-models/dataModel.Weather/tree/master/WeatherForecast
  match: none
  note: 'Gap in EDINT: the environment ontology models observations (SOSA), not forecasts.'
- id: aviso-meteorologico
  label: Weather warning
  sdmModel: WeatherAlert
  sdmSubject: dataModel.Weather
  sdmSchema: https://github.com/smart-data-models/dataModel.Weather/tree/master/WeatherAlert
  match: none
  note: 'Gap in EDINT: no class for weather warnings (e.g. AEMET CAP alerts).'
