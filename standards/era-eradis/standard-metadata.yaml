domains:
  - Transportation
description: >
  ERADIS is one of four registers (alongside RINF, ERATV, EVR) published
  under the single ERA Ontology v3.3.3 -- see era-rinf's standard-metadata.yaml
  for the shared ontology-wide context. ERADIS covers the certification and
  compliance-documentation side of the railway authorisation processes:
  Certificates (safety certificates for railway undertakings), Conformity
  Assessment Body (CAB) evidence, assessment/audit checks and restrictions,
  Certification Level Documents, EC Declarations of Verification/Conformity,
  document sets, validity constraints on certificates/decisions, and
  references to the Technical Specifications for Interoperability (TSIs)
  those checks are performed against.
license: "European Union Public Licence v1.2 (EUPL-1.2)"
licenseNote: >
  Primary source (ontology.ttl) is EUPL-1.2, same as era-rinf/era-eratv. The
  secondary VPA ontology this candidate also depends on is separately
  licensed CC-BY-4.0 (stated in its own ontology header) -- both licences
  apply to this candidate's derivation; EUPL-1.2 to the era: namespace
  content, CC-BY-4.0 to the vpa: namespace content it inlines.
