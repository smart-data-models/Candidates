title: "SAREF4ENER"
publisher: "ETSI (SmartM2M Technical Committee)"
sourceUrl: "https://saref.etsi.org/saref4ener/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
sourceNormativeDocument: "ETSI TS 103 410-1 V2.1.1 (2024-10), SmartM2M; Extension to SAREF; Part 1: Energy Domain"
domains:
  - Energy
  - SmartGrid
  - EnergyFlexibility
  - DemandResponse
  - SmartAppliances
description: >
  SAREF4ENER is the SAREF (Smart Applications REFerence) ontology extension
  for the energy domain, standardized by ETSI as TS 103 410-1. It models the
  energy-flexibility capabilities that a smart device (an appliance, EV
  charger, heat pump, battery, PV inverter, etc.) can expose to a Customer
  Energy Manager (CEM), so that energy consumption/production can be
  (re-)scheduled without materially affecting user comfort. It harmonizes
  two previously separate industry data models -- EEBus/SPINE and the
  CENELEC EN 50491-12-2 "S2" standard -- into a single set of seven
  Flexibility Profile types (Power Profile, Power Limit, Demand Driven,
  Operation Mode, Fill Rate Based, Incentive Table Based, and Power
  Envelope), plus a Flexibility Communication layer (FlexRequest, FlexOffer,
  FlexibilityInstruction), a Load Control event/state model, and generic
  Data Point / Time Series constructs used throughout. This candidate
  translates every class defined in the SAREF4ENER v2.1.1 OWL ontology (77
  classes) into one candidate model per class under models/, except for 16
  pure controlled-vocabulary classes (e.g. Usage, IncentiveType, RoleType,
  InstructionStatus, EventActionConsume/Produce, EventStateConsume/Produce,
  PowerEnvelopeLimitType, PowerEnvelopeConsequenceType, PowerSequenceState,
  PowerSequenceStatus, PowerSource, ScopeType, ValueSource, ValueTendency)
  whose named-individual members are instead embedded as closed JSON Schema
  `enum` arrays on the referencing entity's own property, which is the
  standard Smart Data Models convention for OWL codelists that have no
  independent identity of their own.
