description: >
  OSDU (Open Subsurface Data Universe), a forum of The Open Group, publishes
  an open, vendor-neutral data platform for the energy industry. Its Data
  Definitions are the JSON schemas of the platform's records ("kinds"):
  master data (wells, wellbores, fields, basins, organisations, rigs, ...),
  work-product components (well logs, trajectories, markers, seismic,
  reservoir models, documents, ...), reference data (code lists) and
  datasets. Every record has a common envelope (id, kind, acl, legal,
  ancestry, meta, tags, system audit fields) and a `data` block with the
  domain attributes, built from shared abstract schemas (common resources,
  master, facility, work-product component, spatial location, vertical
  measurements, ...). Many attributes come from PPDM, Energistics and
  other industry standards.
