description: >
  The SunSpec Information Models are the open, Modbus-based data models
  that solar inverters, batteries, meters and other distributed energy
  resources (DER) use to expose their nameplate data, measurements, status
  and settings. They are maintained by the SunSpec Alliance, are referenced
  by IEEE 1547-2018 (SunSpec Modbus is one of the DER communication
  protocols it allows), and are implemented by most PV inverter manufacturers. Each model has a
  numeric id and a fixed set of named points (registers) with a type, units,
  an optional scale factor and, for enums and bitfields, named symbols:
  model 1 (common) identifies the device; the 100 series are the legacy
  inverter models; the 200 series meters; the 300-600 series environmental,
  string combiner, module and tracker models; the 700 series the IEEE
  1547-2018 DER models; the 800 series batteries. Release v2026-04-20 has
  113 models.
