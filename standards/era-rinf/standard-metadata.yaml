title: "ERA RINF (Register of Infrastructure)"
publisher: "European Union Agency for Railways (ERA)"
sourceUrl: "https://rinf.data.era.europa.eu/era-vocabulary/"
sourceOntologyVersion: "ERA Ontology v3.3.3 (released 2026-07-28)"
sourceOntologyDownload: "https://rinf.data.era.europa.eu/era-vocabulary/ontology.ttl"
sourceOntologyRepository: "https://gitlab.com/era-europa-eu/public/interoperable-data-programme/era-ontology/era-ontology"
sourceApplicationGuide: "https://rinf.data.era.europa.eu/era-vocabulary/rinf-appGuide/"
sourceDOI: "https://doi.org/10.5281/zenodo.15089005"
domains:
  - Transportation
  - SmartCities
description: >
  RINF is one of four registers (alongside ERATV, ERADIS, EVR) published under
  the single ERA Ontology v3.3.3. RINF itself covers the physical and
  topological railway infrastructure of the EU network: operational points,
  tracks (running tracks and sidings), sections of line, tunnels, bridges,
  platforms, level crossings, switches, signals, electrification (contact
  line systems, pantograph/phase-separation parameters), control-command and
  signalling (ETCS, Radio Block Centres, train detection systems, GSM-R), and
  the abstract network/topology graph model (NetElement, LinearElement,
  NetRelation, linear positioning systems) that ties physical assets to a
  navigable network representation. This candidate is the RINF sub-standard
  only; ERATV (authorised vehicle types), ERADIS (authorisation/certification
  documents), and EVR (vehicle register) are separate sub-standards of the
  same ontology, planned as later candidates under their own standards/
  folders (era-eratv, era-eradis, era-evr) since they are distinct subject
  areas with their own entity graphs, sharing only a handful of admin classes
  (era:Body, era:OrganisationRole) with RINF.
license: "European Union Public Licence v1.2 (EUPL-1.2)"
licenseNote: >
