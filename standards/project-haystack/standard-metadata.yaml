description: >
  Project Haystack is an open-source ontology and tagging convention for
  building and IoT data: sites, spaces, equipment, data points (sensors,
  commands, setpoints), systems, devices, networks and weather stations,
  described by marker tags (ahu, vav, discharge, air, temp, sensor, ...),
  value tags and Ref tags (siteRef, equipRef, spaceRef, ...). Haystack 4
  defines these as "defs" grouped in the libraries ph, phScience, phIoT and
  phIct (719 defs in version 4.0.0) and publishes an RDF export. Haystack 5
  (Xeto) gives the same entities PascalCase spec names (ph::Site,
  ph::Equip, ph::Point, ...), which are used here as model names.
