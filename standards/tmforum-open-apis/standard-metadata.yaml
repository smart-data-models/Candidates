  Translated on 2026-11-13 (5 models); extended on 2026-11-14 to all
  Apache-2.0 TM Forum Open APIs. Source row 35 ("TM Forum Open APIs",
  sector Telecom) of the "Level A standards not in Smart Data Models" list
