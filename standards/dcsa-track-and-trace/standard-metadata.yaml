notes: |
  Translated on 2026-11-13. Source row 20 ("DCSA standards") of the "Level
  A standards not in Smart Data Models" list (licence verified: Yes).

  SCOPE: "DCSA standards" is a family of about 30 APIs. This candidate
  covers Track & Trace 2.2.0, the most widely implemented one and the one
  that fits NGSI-LD best (events about containers, vessels and
  shipments). Newer DCSA APIs (Port Call / JIT 2.0, Operational Vessel
  Schedules, Booking 2.0, eBL 3.0, Arrival Notice, VGM) are possible next
  candidates; JIT Port Call and Operational Vessel Schedules overlap with
  dataModel.MarineTransport.

  MODELS (3), one per event type. Entity names are the DCSA Information
  Model entity names (the OpenAPI component keys are lower camel case:
  shipmentEvent, transportEvent, equipmentEvent):
    - ShipmentEvent   eventType SHIPMENT  (booking / document status: received,
                                           confirmed, issued, surrendered, ...)
    - TransportEvent  eventType TRANSPORT (ARRI / DEPA at a transport call)
    - EquipmentEvent  eventType EQUIPMENT (LOAD, DISC, GTIN, GTOT, STUF, STRP,
                                           PICK, DROP, INSP, RSEA, RMVD)
  The NGSI-LD id is urn:ngsi-ld:<Type>:<eventID> (DCSA eventID is a UUID).

  NAMING: every field name is DCSA's, verbatim (eventID,
  eventClassifierCode, equipmentReference, ISOEquipmentCode,
  UNLocationCode, ...). None clashes with NGSI-LD reserved terms at entity
  level (transportCall.location is nested).

  STRUCTURE: the OpenAPI schemas were resolved (all $refs and allOf
  merged) and converted to JSON Schema 2020-12: nullable dropped, example
  -> examples, HTML markup removed from descriptions. Nested objects
  (transportCall with its vessel and location, eventLocation, seals,
  references, documentReferences) keep their full DCSA structure and are
  "@type": "@json" in the contexts. Code lists defined by DCSA are enums,
  as in the source.
  Deprecated fields are left out: eventTypeCode (all three), the top-level
  transportCallID, transportCall.carrierVoyageNumber (replaced by
  exportVoyageNumber / importVoyageNumber), vesselScheduleChangeRemark
  (replaced by changeRemark), shipmentID and shipmentInformationTypeCode
  (replaced by documentID / documentTypeCode).

  CONTEXT IRIs: DCSA has no RDF vocabulary. Each term maps to its OpenAPI
  component on SwaggerHub (DCSA defines most fields as their own
  component, e.g. #/components/schemas/equipmentReference), otherwise to
  the property path inside the event component.

  NON-DCSA ADDITION: `location` (GeoProperty, GeoJSON Point) on
  TransportEvent and EquipmentEvent, built from the latitude/longitude
  strings of the DCSA location (eventLocation or transportCall.location)
  so that NGSI-LD geo-queries work. The DCSA objects are kept unchanged.

  SOURCE ISSUES (handled here, worth reporting upstream):
    - documentReferences[].documentReferenceType enumerates "BKG (Booking)"
      and "TRD (Transport Document)", but the specification's own examples
      (and the reference implementation) use "BKG" and "TRD". The enum here
      is ["BKG", "TRD"].
    - ShipmentEvent.eventDateTime is redefined with only a description
      ("must be the same value as eventCreatedDateTime") and no type; it is
      typed here as a date-time string, as in the other events.

  EXAMPLES ARE SYNTHETIC: DCSA publishes no open event data, carriers'
  Track & Trace APIs require accounts, and the test data in the DCSA-TNT
  reference implementation is placeholder content (e.g. location "Eiffel
  Tower" with UN/LOCODE USNYC), so it was not used. The three examples
  describe one consistent, fictitious shipment: booking BKG2611000123 is
  confirmed (ShipmentEvent CONF), container CSQU3054383 (the sample number
  of ISO 6346, type 22G1) is loaded, laden and sealed, at the Port of
  Rotterdam (EquipmentEvent LOAD), and the vessel "EXAMPLE EXPRESS"
  (fictitious; IMO 9999993 has a valid check digit but is not a real ship)
  departs on export voyage 0461W, delayed by weather (TransportEvent
  DEPA, SMDG delay reason WEA). Codes (NLRTM, POTE, ACT, LADEN, BLT, CAR)
  are real DCSA / UN / SMDG values; coordinates are approximate for
  Maasvlakte. Each example says so in `source`.

  DUPLICATION RISK: dataModel.MarineTransport already has Vessel,
  PortCall, Booking, Terminal and EdiCodeco (EDIFACT CODECO container
  gate-in/gate-out reports, which overlap with EquipmentEvent GTIN/GTOT).
  The SIMPLE logistics candidates also describe logistics events. Check
  these before promotion.
