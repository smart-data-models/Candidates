title: "SAREF4WEAR"
publisher: "ETSI"
sourceUrl: "https://saref.etsi.org/saref4wear/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
normativeReference: "ETSI TS 103 410-9 V2.1.1 (2024-07): SmartM2M; Extension to SAREF; Part 9: Wearables Domain"
domains:
  - Wearables
  - eHealth
  - SmartTextiles
description: >
  SAREF4WEAR is the ETSI SAREF extension for the Wearables domain (ETSI TS 103 410-9), built on top of SAREF
  core, SAREF4SYST and SAREF4CITY. It models wearable devices (WearableDevice and its InBodyWearable /
  OnBodyWearable / NearBodyWearable / TextileBasedWearable / FabricWearable specializations, classified by their
  physical relationship to the body), the organisms and actors around them (LivingOrganism, Wearer, User,
  Software), detectable occurrences (Occurrence), the hardware components a wearable can be built from
  (Interface, PowerSupply, MemoryStorage, TextileBasedSensor), the policies a wearable follows (Policy), the
  functions a wearable can perform (CommunicatingFunction, ControllingFunction, NavigatingFunction,
  NotifyingFunction), and a classification of the kinds of properties relevant to the domain (wearable,
  wearer/biometric, electrical/electrical-safety, emission, environmental and crowd properties). This candidate
  translates the full v2.1.1 class list (29 classes) into one candidate per class under models/, except where
  explicitly consolidated -- see METHOD below.
