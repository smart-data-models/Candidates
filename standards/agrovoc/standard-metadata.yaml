domains:
  - Agrifood
  - CrossSector
description: >
  AGROVOC is FAO's multilingual controlled vocabulary for agriculture,
  food, nutrition, fisheries, forestry, environment and related domains.
  The 2026-11-05 release has 42,100 concepts and 1,266,017 lexical labels in
  42 languages (10.2 million triples), published as SKOS with SKOS-XL
  reified labels. Concepts are linked by SKOS hierarchical, associative and
  mapping relations (exactMatch and closeMatch to other thesauri) and by
  the Agrontology, FAO's ontology of domain relations (hasPest,
  isProducedBy, hasTaxonomicRank, ...). In Smart Data Models terms, AGROVOC
  is the reference vocabulary that agrifood entities can point to, e.g.
  the crop of an AgriParcel or the species of an Animal.
license: "CC-BY-4.0"
licenseNote: >
  Confirmed via AGROVOC's VoID dataset description
  (http://aims.fao.org/aos/agrovoc/void.ttl): dct:license
  <https://creativecommons.org/licenses/by/4.0/> and dc:rights "CC-BY 4.0".
  Every example is a verbatim AGROVOC record, and attribution is given in
  each example's `source`.
