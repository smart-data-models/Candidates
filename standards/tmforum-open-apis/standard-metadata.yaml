sourceOntologyFormat: "OpenAPI 3.0.1 (YAML) and Swagger 2.0 (JSON) specifications; no RDF vocabulary"
sourceExampleUrl: "components/examples of each v5 OpenAPI file (retrieve-by-id response payloads); v4 Swagger files have no example payloads, only property-level example values"
sourceExampleLicense: "Apache-2.0 (TM Forum); illustrative example payloads from the specifications, not real operator data"
domains:
  - CrossSector
  - SmartCities
description: >
  The TM Forum Open APIs are the family of REST APIs of TM Forum's Open
  Digital Architecture (ODA), implemented by communication service providers
  and their IT vendors for catalogue, ordering, inventory, assurance, billing,
  party, usage, testing, IoT, AI and partner (Open Gateway) management. This
  candidate covers every TM Forum Open API published in github.com/tmforum-
  apis under the Apache-2.0 licence (86 APIs) with one model per managed
  resource (the resources with their own collection endpoint, identity and
  state): 174 models, from ProductCatalog, ProductOffering and
  ProductSpecification through ProductOrder, Product, Service and Resource to
  TroubleTicket, Alarm, ServiceProblem, CustomerBill, BillingAccount,
  Individual, Organization, PartyRole, GeographicAddress / GeographicSite /
  GeographicLocation, Intent, the test-management family and the IoT and AI
  component suites. References between these resources are NGSI-LD
  Relationships (213 of them). The sector is Telecom; the APIs are also used
  by other digital-service providers (utilities, cloud, smart-city operators).
license: "Apache-2.0"
licenseNote: >
  Checked per repository at the exact release tag (or commit) used: all 88 TMF
  repositories used or examined contain an Apache License 2.0 LICENSE file (71
  with TM Forum's appendix 'How to apply the Apache License to your TM Forum
  work' stating that the TM Forum API Deliverables 'were contributed to the TM
  Forum by an Apache 2.0 License Mode Team and are subject to an Apache 2.0
  License Mode Copyright Notice', 17 with the plain Apache 2.0 text), and
  GitHub's licence API reports Apache-2.0 for them. TM Forum's 'API Apache 2.0
  Project' page (https://www.tmforum.org/collaboration/api-apache-2-0-project)
  states that the 'code' part of the Open APIs (the OpenAPI/Swagger files) is
  released under Apache 2.0. Excluded: TMF667_Document (no LICENSE file in the
  repository) and TMF123_Template (repository template, not an API). 15 of the
  files used still carry an old 'Copyright (c) TM Forum 20xx. All Rights
  Reserved' line in info.description (TMF622, 635, 637, 641, 648, 663, 670,
  687, 700, 701, 703, 724, 767, 931, 936); the repository LICENSE and the
  Apache 2.0 Project statement govern, and this line should be fixed upstream.
  Only the OpenAPI/Swagger files were used; the specification documents (user
  guides, PDF/Word) are TM Forum member documents, not Apache-licensed, and
  were not used. Attribution: TM Forum (Apache-2.0; NOTICE: derived from the
  TM Forum Open API specifications).
