domains:
  - SmartCities
  - CrossSector
description: >
  OCDS is the open data standard for publishing information on public
  contracting: planning, tender, award, contract and implementation. Data
  is published as releases (notices about one stage of a contracting
  process, identified by its ocid) that can be compiled into records. It
  is used by more than 50 governments and many cities, including the UK
  Find a Tender and Contracts Finder services, and is the basis of the
  OCDS for EU profile used for eForms.
license: "Apache-2.0"
licenseNote: >
  Confirmed via the repository LICENSE file (Copyright (c) 2014-2017 Open
  Contracting Partnership, Apache License 2.0). The examples use a real
  UK Find a Tender Service release; the release package states the Open
  Government Licence v3.0, and attribution is given in each example's
  `source`.
