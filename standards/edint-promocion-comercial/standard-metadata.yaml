title: "EDINT Commercial Promotion Ontology (Ontología de Promoción Comercial)"
publisher: "EDINT - Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EU-funded), with Universidad Politécnica de Madrid (UPM/OEG) as technical developer"
sourceUrl: "https://github.com/EDINT-Ontologia/edint-ontologia-promocion-comercial/tree/main"
sourceOntologyIRI: "http://vocab.linkeddata.es/datosabiertos/def/comercio/promocion"
sourceOntologyVersion: "0.1.0"
domains:
  - SmartCities
  - UrbanInfrastructure
description: >
  Vocabulary for commercial promotion: campaigns (vouchers, discounts,
  revitalization drives) and events (fairs, thematic markets, local
  events) run to promote commercial activity in a zone.
license: "CC-BY-4.0"
licenseNote: >
  Same as its sibling EDINT ontologies (edint-censo-vehiculos,
  edint-aparcamiento, edint-fotovoltaica, edint-organizaciones,
  edint-catastro, edint-medio-ambiente, edint-contaminacion-acustica,
  edint-suministro, edint-trafico, edint-vehiculos-compartidos,
  edint-alumbrado-publico, edint-gestion-residuos, edint-censo-locales),
  this source ontology is CC-BY-4.0.
contributors:
