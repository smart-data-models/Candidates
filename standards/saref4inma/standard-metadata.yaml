title: "SAREF4INMA"
publisher: "ETSI"
sourceUrl: "https://saref.etsi.org/saref4inma/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
normativeReference: "ETSI TS 103 410-5 V2.1.1 (2024-07): SmartM2M; Extension to SAREF; Part 5: Industry and Manufacturing Domains"
normativeReferenceUrl: "https://www.etsi.org/deliver/etsi_ts/103400_103499/10341005/02.01.01_60/ts_10341005v020101p.pdf"
domains:
  - Manufacturing
  - Industry4.0
  - CrossSector
description: >
  SAREF4INMA is an OWL-DL extension of the SAREF (Smart Applications
  REFerence) ontology for the industry and manufacturing domain, published
  by ETSI as TS 103 410-5. It solves the lack of interoperability between
  different types of production equipment that produce items in a factory
  and, once items leave the factory, between the different organizations in
  a value chain that need to uniquely trace a produced item back to the
  corresponding production equipment, batch, material and precise time of
  manufacture. The ontology was created to align with Industry 4.0
  initiatives (e.g. RAMI - Reference Architectural Model Industry 4.0) and
  reuses concepts from IEC 62264 (enterprise-control system integration) for
  its factory/site/area/work-center location hierarchy. SAREF4INMA extends
  SAREF with 21 classes, 16 object properties and 10 data type properties,
  and reuses (imports) the core SAREF and SAREF4BLDG (SAREF for buildings)
  ontologies rather than redefining their classes.
  This candidate translates all 21 classes defined directly in SAREF4INMA
  v2.1.1 into one model per class: Area, Batch, Factory, GTIN8ID, GTIN12ID,
  GTIN13ID, GTIN14ID, ID, IRDI, Item, ItemBatch, ItemCategory, MaterialBatch,
  MaterialCategory, ProductionEquipment, ProductionEquipmentCategory,
  ProductionEquipmentFunction, Site, Size, UUID and WorkCenter. Classes that
  SAREF4INMA merely reuses by importing other ontologies (e.g. saref:Device,
  saref:FeatureOfInterest, saref:Property, saref:Observation, saref:State,
  saref:Function from SAREF core; s4bldg:Building, s4bldg:BuildingSpace,
  s4bldg:PhysicalObject from SAREF4BLDG) are referenced from the relevant
  model's description/relationship target but are out of scope for this
  candidate set (they belong to their own ontologies' translations).
