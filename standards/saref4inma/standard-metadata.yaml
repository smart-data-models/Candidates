notes: |
  Translated on 2026-10-14 from:
    - the Turtle serialization of the ontology itself:
      https://saref.etsi.org/saref4inma/v2.1.1/saref4inma.ttl (parsed in
      full for the exhaustive class/property/subclass list), and
    - the full normative ETSI TS 103 410-5 V2.1.1 PDF (22 pages), read in
      full for narrative class definitions (clause 4.2, Tables 2-5) and the
      worked "PhilBrau S40 Premium Gold Shaver" manufacturing example
      (clause 4.3, Figures 4-8), which supplied the realistic values used in
      every model's examples/example.json (factory Eindhoven_BIC, site
      BIC_Site_A, area Site_A_Area_19, Welding_WorkCenter, the
      WandI_Welding_Series_1000 welding machine category/instances, the
      Lazor_Series_8030 laser-cutting category, the
      PhilBrau_S40_Premium_Gold_Shaver item/item-category/item-batch, and
      the Torx-screw/ABS-plastic material batches and categories).

  INHERITANCE FLATTENING: following the Gaia-X ontology candidate's
  precedent already in this repo (standards/gaiax-ontology-v2111/, e.g.
  TaxID vs. RegistrationNumber, ComputeServiceOffering vs.
  ServiceOffering/InfrastructureServiceOffering), every SAREF4INMA subclass
  relationship is modeled by giving the subclass model ONLY its own new
  properties, with a description note pointing to the parent model for
  inherited properties (not repeated in the subclass's schema.json):
    - GTIN8ID, GTIN12ID, GTIN13ID, GTIN14ID, IRDI, UUID -> ID (each uses its
      own more specific hasXxxValue property, a declared sub-property of
      ID's hasIDValue, so hasIDValue itself is not duplicated).
    - ItemBatch, MaterialBatch -> Batch (hasIdentifier, hasSize,
      needsEquipment, consistsOf stay on Batch only).
    - WorkCenter -> ProductionEquipment (the ttl declares no additional own
      property for WorkCenter at all, so its schema only adds a usability
      `name` field plus the common envelope).

  OUT-OF-SCOPE EXTERNAL CLASSES: ProductionEquipment, Area, Site, Factory,
  Item and Batch subclass classes from the imported SAREF core and
  SAREF4BLDG ontologies (saref:Device, saref:FeatureOfInterest,
  geo:SpatialObject, s4bldg:Building, s4bldg:BuildingSpace,
  s4bldg:PhysicalObject). Those parent classes, and SAREF-core properties
  reused directly on SAREF4INMA classes (hasManufacturer, hasModel,
  hasVersion, hasState, hasName, consistsOf, hasFunction, observes,
  madeExecution) and SAREF4BLDG properties (hasSpace, contains), are
  referenced with their real external namespace IRIs in each model's
  context.jsonld, but are not modeled as their own Candidates entities here
  (that is the scope of a SAREF-core / SAREF4BLDG translation, not this
  SAREF4INMA one).

  SIMPLIFICATION: the ontology additionally declares six convenience object
  sub-properties of hasIdentifier (hasGTIN8ID, hasGTIN12ID, hasGTIN13ID,
  hasGTIN14ID, hasIRDI, hasUUID) that let an entity link directly to a
  specific identifier subtype instead of the generic hasIdentifier. To avoid
  six near-duplicate optional Relationship properties on every identified
  class (Item, ItemCategory, ProductionEquipment, Batch), only the generic
  hasIdentifier relationship (targeting any ID/GTIN*ID/IRDI/UUID instance)
  is modeled on those classes; this is noted as a deliberate simplification.

  USABILITY ADDITIONS NOT LITERAL TO THE TTL (each flagged in its own
  schema.json property description): Size.value / Size.unitCode (Size has
  no declared OWL data property at all, but needs a usable numeric payload
  to be the meaningful target of Batch.hasSize); ProductionEquipmentFunction
  .name and WorkCenter.name (both classes have no declared own property,
  but both are directly instantiated by name in the ETSI worked example,
  e.g. ex:JoiningFunction, ex:Welding_WorkCenter).

  NAMING: class and property names are preserved verbatim from the source
  ontology (e.g. `GTIN8ID`, `hasGTIN8IDValue`, `belongsToItemBatch`) per
  system_prompt.md's naming rules -- no forced renaming of ontology-native
  identifiers; all are already valid NGSI-LD terms as given.
