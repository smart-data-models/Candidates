title: "AGROVOC Multilingual Thesaurus"
publisher: "Food and Agriculture Organization of the United Nations (FAO), with the AGROVOC editorial community"
sourceUrl: "https://agrovoc.fao.org/"
specificationUrl: "https://www.fao.org/agrovoc/"
contact: "agrovoc@fao.org"
sourceOntologyVersion: "AGROVOC release of 2026-11-05 (dct:modified of the concept scheme and of the VoID dataset description)"
sourceOntologyDownload: "https://agrovoc.fao.org/latestAgrovoc/agrovoc_lod.nt.zip (also queried live at https://agrovoc.fao.org/sparql)"
sourceOntologyNamespace: "http://aims.fao.org/aos/agrovoc/ (concepts and labels), http://aims.fao.org/aos/agrontology# (Agrontology relations)"
sourceOntologyFormat: "SKOS and SKOS-XL RDF, with the Agrontology OWL ontology for domain-specific relations"
