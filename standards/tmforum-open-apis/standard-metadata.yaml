  VERSIONS: the 5 models of the first release (TroubleTicket, ProductOrder, Product, Service, Resource) were
  regenerated with the generic generator and their schema changed, so
  $schemaVersion is 0.0.2: references to other entities of the candidate are
  now Relationships (Product.productOffering, productSpecification,
  billingAccount, intent; Service.serviceSpecification, intent;
  Resource.resourceSpecification, intent; TroubleTicket.
  troubleTicketSpecification; ProductOrder.agreement, billingAccount,
  payment, quote) instead of nested @json Ref objects, and the
  descriptions name the API by its info.title. All other models are new
  (0.0.1).

  TYPE-NAME COLLISIONS BETWEEN APIS (one model per name, from the
  canonical API):
    - Service: TMF638 (also exposed by TMF640, TMF909); Resource: TMF639
      (also TMF702, TMF730); ResourceSpecification: TMF634 (also TMF730,
      TMF908); Alarm: TMF642 (also TMF908, TMF915); Topic and Event: TMF688
      (also TMF915); ServiceCatalog/ServiceCategory/ServiceCandidate/
      ServiceSpecification: TMF633 (also TMF909, TMF914); ServiceProblem:
      TMF656; ServiceTest/ServiceTestSpecification: TMF653;
      UsageConsumptionReport: TMF677 (all three also in TMF909, TMF914);
      BillingAccount, CustomerBill, AppliedCustomerBillingRate, ProductOrder,
      TroubleTicket, Product, ProductOffering, Usage (= ProductUsage),
      Userinfo: canonical APIs, re-exposed by TMF910. The suite copies are
      older v3/v4 snapshots of the same resources, not different concepts.
    - ServiceQualification (TMF909/TMF914, pre-v5 name) is the resource that
      TMF645 v5 splits into CheckServiceQualification and
      QueryServiceQualification.
    - Association: TMF662 Entity Catalog and TMF703 Entity Inventory define
      it with identical attributes; taken from TMF662.
    - ProductOffering / ProductSpecification (TMF620) vs TMF936 Open Gateway:
      TMF936 defines its own extended components OpenGatewayProductOffering
      and OpenGatewayProductSpecification, kept as separate models under
      TMF's own (already prefixed) names.
    - ResourceFunction: a sub-class of Resource in TMF639 v5 (its attributes
      are flattened into Resource) and a managed resource of its own in
      TMF664 (model ResourceFunction).
    - Entity (TMF703) is an NGSI-LD core term: renamed TmfEntity. It is
      TMF's generic, extensible inventory entry (identity and polymorphism
      attributes only; the actual content comes from @schemaLocation).
    - ShipmentTracking: TMF684's resource /shipmentTracking is described by
      the definition TrackingDetailsType; the model takes the resource name.

  NAMING: TMF attribute names verbatim, except these entity-level renames
  (NGSI-LD reserved terms, JSON-LD keywords, SDM common attributes):
    id -> tmfId, @type -> tmfType, @baseType -> tmfBaseType,
    @schemaLocation -> tmfSchemaLocation, @referredType -> tmfReferredType
    (TestSuiteExecution), value -> tmfValue (Resource, ResourceFunction,
    DataAccessEndpoint, IotDevice, LoyaltyCondition), type ->
    tmfTypeAttribute (LoyaltyAction), location -> tmfLocation (ChangeRequest,
    Individual, IotDevice: not GeoJSON geometries), source -> tmfSource
    (Event, IotDevice), dateCreated / dateModified / dataProvider ->
    tmfDateCreated / tmfDateModified / tmfDataProvider (IotDevice, whose
    TMF908 definition copies these SDM attributes). Inside nested objects
    (@json) all TMF names are kept unchanged.

  MAPPING:
    - TMF polymorphism: the NGSI-LD type is the TMF resource; tmfType keeps
      @type (sub-class or extension in use), tmfBaseType and
      tmfSchemaLocation are kept. tmfType is required where @type is.
    - Resource sub-classes LogicalResource, PhysicalResource,
      SoftwareResource, ResourceFunction are flattened into Resource.
    - Relationships (213 in 100 models): an entity-level attribute whose TMF type is
      XRef or XRefOrValue, where X is a model of this candidate (same API
      first, then the canonical one), is an NGSI-LD Relationship
      (urn:ngsi-ld:X:<TMF id>); e.g. ProductOffering ->
      ProductSpecification / ProductOfferingPrice / Category,
      ProductSpecification -> ServiceSpecification / ResourceSpecification,
      Service -> ServiceSpecification, Resource -> ResourceSpecification,
      Product -> ProductOffering / BillingAccount, ServiceProblem ->
      Service / Resource / TroubleTicket, CustomerBill -> BillingAccount /
      BillCycle, Customer / PartyRole -> PartyRoleSpecification /
      PaymentMethod, test executions -> test cases / suites / data.
      Generic refs (EntityRef, PartyRef, PlaceRef, AccountRef, EventRef,
      UsageRef) and refs that carry a role or relationship type
      (relatedParty, productRelationship, relatedEntity, place, ...) stay
      nested @json with their full TMF structure in $defs.
    - OpenAPI/Swagger to JSON Schema 2020-12: $ref -> #/$defs, allOf kept,
      oneOf -> anyOf (TMF alternatives overlap and are told apart only by
      the discriminator on @type), discriminator/nullable/readOnly dropped,
      example -> examples, code lists as enums. Discriminator mappings are
      not followed except for Characteristic (its value sub-classes are in
      $defs).
    - href is kept as an optional Property but no longer required where TMF
      requires it (TMF664 ResourceFunction, TMF684 TrackingDetailsType): it
      is the URL of the resource in one API instance, not data.
    - Deprecated attributes left out: ApiDigitalIdentity.jwksUri, ApiDigitalIdentity.redirectUrl, AttachmentRef.description, AttachmentRef.url, AttachmentRef_EVO.description, AttachmentRef_EVO.url, CheckProductOfferingQualification.instantSyncQualification, CheckServiceQualification.instantSyncQualification, GeographicSite.code, GeographicSite_EVO.code, ProductOfferingTermOrConditionApproval.authorization, QueryProductOfferingQualification.instantSyncQualification, QueryServiceQualification.instantSyncQualification, RelatedOrderItem.role, Resource.category, Resource.powerState, Resource.versionNumber, TestMeasure.metricHref, TestMeasureDefinition.metricHref, TestMeasureDefinition.valueType.

  CONTEXT IRIs: TMF has no RDF vocabulary. Each term maps to its component
  property inside the OpenAPI/Swagger file at the tag or commit used
  (https://github.com/tmforum-apis/<repo>/blob/<tag>/<file>#/components/schemas/<Component>/properties/<attribute>,
  or #/definitions/... for Swagger 2.0); inherited attributes point to the
  component that declares them. All 3181 TMF IRIs were checked against the
  files and the 81 file URLs return HTTP 200.

  PERSONAL DATA: Individual, Customer, Customer360, PartyInteraction,
  DigitalIdentity, Userinfo, User, ApplicationOwner, LoyaltyMember,
  PartyPrivacyAgreement/Profile, SalesLead, SalesOpportunity,
  CommunicationMessage, Appointment, PaymentMethod, PartyAccount,
  BillingAccount, ShippingOrder, ShipmentTracking and PartyRole hold
  personal data in real deployments. All examples are fictitious: names of
  people found in the TMF example payloads (about 35, e.g. in references
  to Individuals, note authors, account contacts) are removed or replaced
  by the placeholder "Jane Doe"; birth dates set to 1990-01-01; e-mail
  addresses replaced by contact@example.com; phone numbers by numbers
  reserved for fiction (Ofcom +44 7700 900xxx, NANP 555-01xx, ARCEP
  +33 1 99 00 xx xx); postal addresses of people by "1 Example Street",
  postcode 00000, Exampletown; identity-document numbers by EXAMPLE-0001;
  URLs in synthetic examples point to example.com.

  EXAMPLES: 78 models use the retrieve example payload of their v5
  OpenAPI file (Apache-2.0, illustrative; the five original models keep
  their aligned set: Product g265-tf85 realized by Service 5351 and Resource
  839933ec-..., TroubleTicket 3180 pointing to the Product). 96 models (all from v4 or
  older Swagger files, which have no example payloads) have a synthetic
  example built from
  the schema and its property-level example values, with Relationships to
  the other models' example ids; their `source` says so. Example attributes
  that are not in the schema or violate it were dropped (see SOURCE ISSUES).

  SOURCE ISSUES (worth reporting upstream):
    - 15 OpenAPI/Swagger files still say "All Rights Reserved" (see
      licenseNote); TMF667_Document has no LICENSE file.
    - TMF637 ProductStatusType enumerates "aborted " (trailing space).
    - TMF638 Service example: keys "featureCharacteritic" and
      "ServiceRelationshipCharacteristic" misspelt (fixed in the example).
    - TMF621 example: expectedResolutionDate before creationDate.
    - TMF653 examples use hour 24 ("2016-03-02T24:00:00.30Z"), invalid
      date-times; replaced by T23:59:59.
    - Example attributes absent from the schema: TMF632 Individual.fullName,
      TMF666 *Account.lastModified, TMF683 PartyInteraction.lastUpdateDate,
      TMF921 Intent.isBundled, TMF634 ResourceCandidate.name, TMF677
      UsageConsumptionReport.effectiveDate, TMF678 BillCycle.
      billCycleSpecification, TMF679 "CheckProductOfferingQualificationItem"
      (capitalised key), TMF649 ThresholdRule example (8 attributes of an
      older model: conformanceTargetUpper/Lower, thresholdTarget, ...).
    - TMF771 ResourceUsageSpecification examples have no id (the NGSI-LD
      id of that example is generated); the TMF936 productSpecification
      example has @type ApiProductSpecification.
    - TMF685 Reservation references undefined definitions
      ResourceCharacteristic, ResourceRelationship and "int".
    - TMF671 GET /promotion/{id} returns Promotion_Create instead of
      Promotion.
    - TMF664 ResourceFunction and TMF684 TrackingDetailsType require href.
    - TMF675 GeographicLocation and TMF670 PaymentMethod use @type as a
      code list (GeoJSON geometry types; cash, tokenizedCard, ...).
    - TMF908 IotDevice copies the SDM attributes dateCreated, dateModified,
      source, dataProvider and location into the TMF definition.
    - TMF684 Swagger file is cp1252-encoded, not UTF-8; TMF658, TMF684,
      TMF685, TMF910 are v1 drafts and TMF909 is v3, none released.
    - TMF702 exists twice (TMF702-ResourceActivationConfiguration and
      TMF702_ResourceActivationManagement).

  DUPLICATION RISK (type names; meanings differ unless stated):
    - Official Smart Data Models: Alarm (dataModel.OCF, S4BLDG),
      Appointment (dataModel.PredictiveMaintenance), Event
      (dataModel.TourismDestinations), Organization (dataModel.Organization,
      dataModel.Hl7: same concept), Rule (dataModel.CPSV-AP), Service
      (dataModel.IT). Same scope with other names: Individual vs
      dataModel.Organization Person, IotDevice / IotDeviceSpecification vs
      dataModel.Device Device / DeviceModel, TroubleTicket / Incident vs
      dataModel.IssueTracking IssueReporting, GeographicAddress vs the SDM
      address property, ServiceLevelObjective / Threshold vs
      dataModel.KeyPerformanceIndicator.
    - Other candidates: Organization (realestatecore, edint-organizaciones,
      edint-infraestructura, gs1-web-vocabulary, ocds, hsds), Event
      (saref4city, mds), Incident (mds), Product (untp, gs1-web-vocabulary),
      Resource (gaiax-ontology, saref4envi), Service (hsds), User
      (saref4ehaw, saref4wear). Generic names (Category, Task, Process,
      Rule, Topic, Event, Application, User, Payment, Quote, Promotion,
      Agreement, Appointment, Reservation) will need a TMF prefix or a
      separate subject at promotion.
    - The camara-apis candidate covers network capabilities that TMF931 /
      TMF936 Open Gateway sell as ApiProduct / OpenGatewayProductOffering;
      no type overlap.
