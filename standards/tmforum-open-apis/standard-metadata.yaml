description: >
  The TM Forum Open APIs are a family of about 60 REST APIs for the
  telecom and digital-service industry, part of TM Forum's Open Digital
  Architecture (ODA). They are implemented by communication service
  providers and their IT vendors for ordering, inventory, assurance,
  billing, party and catalogue management. This candidate covers the
  inventory and assurance core: the product a customer holds (TMF637
  Product), the services that realize it (TMF638 Service), the network,
  logical and physical resources that support those services (TMF639
  Resource), the order that created it (TMF622 ProductOrder) and the
  trouble ticket raised when something goes wrong (TMF621 TroubleTicket).
  The sector is Telecom; the APIs are also used by other digital-service
  providers (utilities, cloud, smart-city operators).
