description: >
  The Beneficial Ownership Data Standard (BODS), published by Open
  Ownership, is the open standard for publishing information about who
  ultimately owns and controls companies and other legal entities and
  arrangements. Data is a series of Statements, each a claim made at a
  point in time about a record: an entity (company, trust, state body,
  ...), a natural person, or a relationship (the interests, such as
  shareholdings, voting rights or board appointment, that an interested
  party holds in an entity). It is used by beneficial ownership registers,
  public procurement and anti-corruption programmes, and by the Open
  Ownership Register.
license: "Apache-2.0"
licenseNote: >
  Confirmed via the repository LICENSE file: the schema contents of BODS
  are Copyright (C) 2016-2026 Open Ownership and licensed under the Apache
  License 2.0; the documentation is under the GNU Free Documentation
  License 1.3 (attribute Open Ownership; descriptions in the schemas here
  are taken from the Apache-2.0 schema files). The EntityStatement example
  combines Open Ownership's AstraZeneca PLC example statement (CC BY 2.0,
  Open Ownership) with GLEIF LEI data (CC0); the PersonStatement and
  RelationshipStatement examples are Open Ownership's fictional example
  data. Attribution is given in each example's `source`.
