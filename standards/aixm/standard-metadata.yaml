description: >
  AIXM is the global standard for the digital exchange of aeronautical
  information (the content of the AIP, aerodrome data, navaids, airspace,
  routes, procedures, obstacles and Digital NOTAM). It is developed by
  EUROCONTROL and the FAA, maintained by the international AIXM Change
  Control Board, and it underpins the ICAO PANS-AIM data sets and the EU
  aeronautical data quality rules. AIXM 5 is a UML model and a GML 3.2
  XML Schema with about 170 features and their <<object>> types. Every
  feature is temporal: its values are carried by TimeSlices (BASELINE,
  PERMDELTA, TEMPDELTA, SNAPSHOT) with a validity period.
