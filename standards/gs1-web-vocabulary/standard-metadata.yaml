sourceExampleLicense: "Open Database License (ODbL), Open Food Facts contributors"
domains:
  - SmartLogistics
  - Agrifood
  - CrossSector
description: >
  The GS1 Web Vocabulary is GS1's RDF vocabulary for publishing product,
  organization, location and offer data on the web, linked to GS1
  identifiers (GTIN, GLN) and GS1 Digital Link. It builds on schema.org and
  covers the master data of GS1 standards (GDSN attributes): product
  descriptions, net content and dimensions, packaging, allergens,
  ingredients, nutrition, certifications, apparel and footwear attributes,
  organizations and their roles, places, and offers with prices and
  discounts. Version 1.18 has 120 classes, 557 properties and 63 code lists
  with 1,861 members.
license: "Apache-2.0"
licenseNote: >
  Confirmed via the repository LICENSE file and README ("The GS1 Web
  vocabulary is released under an Apache 2.0 licence"), and the
  schema:license statement in the vocabulary itself ("Copyright 2015-2019
  GS1 AISBL. Licensed under the Apache License, Version 2.0", with GS1's IP
  policy disclaimer). The FoodBeverageTobaccoProduct example uses one Open
  Food Facts record (ODbL, attributed in `source`); the other examples are
  synthetic.
contributors:
