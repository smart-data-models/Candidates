sourceOntologyDownload: "https://ref.gs1.org/voc/data/1.18.0/gs1Voc.ttl"
sourceOntologyNamespace: "https://ref.gs1.org/voc/"
sourceOntologyFormat: "RDF Schema / OWL vocabulary (Turtle and JSON-LD), extending schema.org"
