description: >
  SAREF4CITY is an OWL-DL ontology that extends the ETSI SAREF (Smart
  Applications REFerence) core ontology for the Smart City domain. It was
  developed by ETSI STF 534 to provide a common core of general concepts for
  smart-city data oriented to IoT, covering administrative-area topology
  (countries, cities, districts, neighbourhoods and their containment
  relations), generic city objects (e.g. lampposts, buildings — typically
  co-typed with more specific extensions such as SAREF4BLDG or SAREF4ENVI),
  temporary/scheduled events and their accessibility, agents (persons,
  organizations, public administrations) and the public services they
  provide or use, and a Key Performance Indicator (KPI) pattern that
  separates a general KPI definition from its individual, timestamped
  assessments (e.g. "road congestion" as a KPI, and "70% congestion on road
  segment 50 at 13:30 on 2026-05-20" as one of its assessments). SAREF4CITY
  reuses seven other vocabularies (SAREF core, W3C Time, OGC GeoSPARQL/Simple
  Features, FOAF, W3C Org, DCMI Terms and W3C SKOS, plus the CPSV public
  service vocabulary) rather than redefining their concepts; this candidate
  translates only the 13 classes natively defined in the SAREF4CITY
  namespace (plus their 4 AdministrativeArea subclasses counted individually
  = 14 models), per the exhaustive-translation instructions for this pass.
