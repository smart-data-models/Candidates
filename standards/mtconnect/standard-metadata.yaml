description: >
  MTConnect is an open, royalty-free standard (ANSI/MTC1.4-2018 and later
  versions) for reading data from manufacturing equipment: machine tools,
  robots, additive manufacturing machines and their peripherals. An
  MTConnect Agent publishes a Device Information Model (probe: Devices
  made of Components that expose DataItems of category SAMPLE, EVENT or
  CONDITION), an Observation Information Model (current / sample: the
  timestamped values of those DataItems) and an Asset Information Model
  (cutting tools, files, raw material, fixtures, pallets, QIF documents,
  ...). The normative information model is a SysML model, published as
  documentation at model.mtconnect.org and as XML and JSON Schemas.
