description: >
  The Mobility Data Specification (MDS), a project of the Open Mobility
  Foundation, is the data standard used by cities and other public
  agencies to manage and regulate mobility services that operate in the
  public right of way: shared micromobility (scooters, bikes, mopeds),
  car share and fleets, delivery robots and passenger services (taxis,
  TNCs, robotaxis). Operators share vehicles, trips, vehicle events,
  telemetry, stops, incidents and aggregated reports through the Provider
  and Agency APIs; agencies publish geographies, policies (fleet caps,
  speed limits, fees) and data requirements. MDS 2.0 introduced multiple
  modes; MDS 2.1 adds incidents and enforcement, external references,
  GTFS links, statistical areas, vehicle commissioning dates and
  accelerometer data.
