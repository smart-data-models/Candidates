description: >
  The Open Mining Format (OMF) is an open file format and library, backed
  by the Global Mining Guidelines Group, for exchanging 3D geoscience and
  mining data between applications (geological modelling, mine planning,
  resource estimation). An OMF file holds a project with a list of
  elements; each element has one geometry (point set, line set,
  triangulated surface, grid surface, block model with optional regular,
  octree or free-form sub-blocks, or a composite of other elements) and a
  list of attributes attached to its vertices, primitives, sub-blocks or
  sub-elements (numbers, dates, vectors, text, categories with
  sub-attributes, booleans, colors and textures). OMF 2 stores a
  gzip-compressed JSON index, specified by a JSON Schema, plus the bulk
  arrays as Apache Parquet files and images as PNG/JPEG, all in one ZIP
  archive.
