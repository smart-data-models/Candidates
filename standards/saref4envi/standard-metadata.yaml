description: >
  SAREF4ENVI is ETSI's SAREF extension for the environment domain (ETSI TS
  103 410-2 V2.1.1), published by the SmartM2M technical committee. It
  extends SAREF Core (and reuses SAREF4SYST for connectivity) with two
  largely independent application areas: (1) a lighting/light-pollution
  domain -- light sources, light points, lampposts (including a shielded
  variant), and the photometer/TESS sky-brightness sensor kinds used to
  observe light properties such as illuminance, irradiance and light
  magnitude; and (2) a waste-management domain, itself organised into three
  chronological modules -- Waste (what is discarded, by whom, in what
  container, within what spatial perimeter: building, house, city,
  neighbourhood...), Collection (collection points, depots, itineraries,
  journeys, road segments and the vehicles that travel them), and Treatment
  (the organisations, sites, devices, tasks and functions involved in
  pre-treating, treating -- composting, anaerobic digestion, incineration
  with/without recovery -- and disposing of waste, landfilling included,
  plus the emissions, primary/secondary raw resources and final waste that
  result). This candidate translates the full v2.1.1 class list (66 owl:Class
  declarations in the s4envi namespace, verified by parsing the ontology's
  own Turtle file with rdflib) into one candidate model per real-world
  entity type under models/.
