title: "EDINT Noise Pollution Ontology (Ontología de Contaminación Acústica)"
publisher: "EDINT - Espacio de Datos para las Infraestructuras Urbanas Inteligentes (EU-funded), with Universidad Politécnica de Madrid (UPM/OEG) as technical developer"
sourceUrl: "https://github.com/EDINT-Ontologia/edint-ontologia-contaminacion-acustica/tree/main"
sourceOntologyIRI: "http://vocab.linkeddata.es/datosabiertos/def/contaminacionacustica/"
sourceOntologyVersion: "0.2.0"
domains:
  - SmartCities
  - Environment
description: >
  Small domain extension of the EDINT Environmental Sensors Ontology
  (edint-medio-ambiente) for noise pollution observations, adding
  acoustic-measurement-specific properties (frequency weighting, time
  constant, reference interval, level statistic, predominant emitter type).
license: "CC-BY-4.0"
licenseNote: >
  Same as its sibling EDINT ontologies (edint-censo-vehiculos,
  edint-aparcamiento, edint-fotovoltaica, edint-organizaciones,
  edint-catastro, edint-medio-ambiente), this source ontology is CC-BY-4.0.
contributors:
