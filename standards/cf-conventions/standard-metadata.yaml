notes: |
  Translated on 2026-11-13. Source row 55 ("CF (Climate and Forecast)
  Metadata Conventions 1.13", sector Environment, licence marked "Partial")
  of the "Level A standards not in Smart Data Models" list. Licence
  verified: CC0-1.0 for the document and the standard name table.

  SCOPE: CF is a metadata convention for netCDF, not a data model with
  classes. The candidate models the netCDF parts that carry CF attributes
  and have identity: the dataset (file) and its variables. Generated by
  script from Appendix A (Table A.1, 64 attributes, with type and "Use"
  columns) and Appendix F (Table F.1, grid mapping attributes) of the CF
  1.13 HTML, and from the Standard Name Table XML version 95.

  MODELS (4):
    - Dataset             global attributes (Use G / Gr): Conventions,
                          title, institution, source, history, references,
                          comment, featureType, external_variables (15 props)
    - DataVariable        attributes with Use D (33 CF attributes, 42 props)
    - CoordinateVariable  attributes with Use C / BI, i.e. coordinate and
                          auxiliary coordinate variables (28 CF attrs, 36 props)
    - GridMapping         Table F.1 attributes of a grid mapping variable
                          (32 CF attrs, 40 props)
  Not modelled (follow-ups): geometry container variables (Use M),
  quantization variables (Q), domain variables (Do), aggregation variables
  (A), boundary/climatology variables, UGRID mesh topology variables
  (Appendix K), interpolation variables (Appendix J), and CF groups.

  NAMING: CF attribute names are kept verbatim, including snake_case,
  leading underscore (_FillValue) and capitals (Conventions). Two renames:
  CF `source` -> `cfSource` (clashes with the Smart Data Models common
  `source`), CF `location` (UGRID mesh location, data variables) ->
  `cfLocation` (reserved in NGSI-LD for the GeoProperty). Entity type
  names are the CF terms (data variable, coordinate variable, grid mapping
  variable; "dataset").

  MAPPING:
    - standard_name is an enum of the 5,097 names of Standard Name Table
      v95 ($defs/standardNameTable; the 600 alias entries, i.e. superseded
      names, are left out), or a name followed by a non-deprecated standard
      name modifier (detection_minimum, standard_error; Appendix C).
      computed_standard_name uses the same enum. Values are kept as plain
      CF strings, as in netCDF; each resolves in the NERC Vocabulary
      Server as http://vocab.nerc.ac.uk/standard_name/<name>/ (P07). They
      are not expanded to IRIs in the context because the NVS IRIs need a
      trailing slash (not producible with @vocab) and modifier values
      contain a space.
    - Enums from the CF text: axis (X/Y/Z/T), cf_role (timeseries_id,
      profile_id, trajectory_id), units_metadata (temperature: on_scale /
      difference / unknown), grid_mapping_name (17 mappings),
      indexing_scheme, fixed_angle_axis, sweep_angle_axis. featureType and
      positive are case-insensitive in CF, so they are case-insensitive
      regex patterns instead of enums. calendar is open in CF (any other
      value allowed), so it is a plain string listing the defined values.
    - Types: S -> string; N / D -> number or array of numbers, tightened
      where CF says so (actual_range / valid_range: 2 numbers,
      month_lengths: 12, towgs84: 3-7, standard_parallel: 1-2, quantization
      and HEALPix parameters integers).
    - Required: Conventions on Dataset (CF 2.6.1 "must"),
      grid_mapping_name on GridMapping (Appendix F), variableName on the
      variable models.
    - Context IRIs: CF has no RDF vocabulary for its attributes (the old
      def.scitools.org.uk CFTerms namespace no longer resolves). Terms map
      to stable pointers into the CF 1.13 HTML: #attribute-appendix/<name>
      for Appendix A attributes, #appendix-grid-mappings/<name> for Table
      F.1, and real section anchors for the entity types.
    - Deprecated: straight_vertical_longitude_from_pole (Table F.1) left
      out; calendar value gregorian documented as deprecated; modifiers
      number_of_observations and status_flag (deprecated) not accepted.
  NON-CF ADDITIONS: variableName (the netCDF variable name, which CF
  attributes such as coordinates, bounds, grid_mapping refer to),
  refDataset (variable -> Dataset) and refGridMapping (DataVariable ->
  GridMapping; the CF grid_mapping string is kept). No `location`
  GeoProperty: CF itself has no dataset footprint attributes (ACDD
  geospatial_* attributes would be a follow-up).

  SOURCE NOTES: in Appendix A of the 1.13 HTML the descriptions of
  standard_name and the appendix intro render "variable"s" / "attribute"s"
  (a straight double quote instead of an apostrophe, AsciiDoc markup issue);
  fixed in the descriptions here. Table F.1's towgs84 description has a
  stray "parameters.," punctuation.

  EXAMPLES ARE REAL: the CF attributes of NOAA PSL's NARR daily mean 2 m
  air temperature file for 2024 (air.2m.2024.nc, OPeNDAP .das header):
  global attributes (Conventions CF-1.2, title, institution, history,
  references, source -> cfSource), the data variable `air`
  (standard_name air_temperature, units K, valid_range, _FillValue,
  missing_value, coordinates "lat lon", grid_mapping Lambert_Conformal),
  the coordinate variable `time`, and the grid mapping variable
  `Lambert_Conformal` (lambert_conformal_conic, standard_parallel 50, 50).
  Non-CF attributes in the file (GRIB_id, var_desc, statistic, latcorners,
  _ChunkSizes, ...) are left out. NOAA/NCEP data are US Government work;
  PSL's acknowledgement text is in `source`. URL-valued CF text attributes
  (references, cfSource) were set back to Property / Text in the
  normalized examples after build_examples.py.

  DUPLICATION RISK: dataModel.DCAT-AP and dataModel.STAT-DCAT-AP define a
  Dataset type (catalogue metadata, different scope; the CF Dataset could
  link to it). dataModel.Weather (WeatherObserved / WeatherForecast) and
  the environment observation candidates hold observed values, which could
  use CF standard names for their properties; no existing model covers
  netCDF/CF variable metadata.
