notes: |
  Translated on 2026-11-13. Source row 65 of the "Level A standards not in
  Smart Data Models" sheet (sector Smart buildings; licence was marked "No",
  i.e. not verified; now verified AFL-3.0, see licenseNote). Generated by a
  script from the normalized defs (defs.json), with every context IRI
  checked against defs.ttl.

  MODELS (8), the direct entity types of Haystack 4 that fit NGSI-LD
  (things with identity and state), named as their Haystack 5 Xeto specs:
    - Site            phIoT:site            (23 attributes)
    - Space           phIoT:space           (12)
    - Equip           phIoT:equip           (47)
    - Point           phIoT:point           (36)
    - System          phIoT:system          (10)
    - WeatherStation  phIoT:weatherStation  (19)
    - Device          phIct:device          (10)
    - Network         phIct:network         (8)
  Each model takes the value tags that Haystack declares (tagOn) on the
  entity, on any of its subtypes (e.g. coolingCapacity on chiller, floorNum
  on floor), on its conjuncts (curVal on cur-point, writeLevel on
  writable-point, weatherStationRef on weather-point), on geoPlace (Site,
  WeatherStation) and on entity (dis). Left out as follow-ups: evseSession,
  pointGroup, mlVar, syntheticModel (the targets of syntheticModelRef are
  outside this candidate), and the Haystack 5 / Xeto slot model.

  NAMING: tag names verbatim. Haystack `id` (a Ref) becomes the NGSI-LD id
  (urn:ngsi-ld:<Model>:<haystack id>). No other renames were needed.

  MAPPING:
    - Marker tags -> `hasTag`, an array of marker names, exactly as the
      Haystack RDF export encodes instance markers (ph:hasTag). It must
      contain the entity marker (site, equip, ...). The enum is the 375
      non-conjunct marker defs of 4.0.0; in JSON-LD a property-scoped
      context expands each value to its def IRI (e.g. phIoT:ahu). Subtype
      markers (ahu, vav, rtu, floor, controller, ...) are therefore the
      way to say which kind of equip/space/device an entity is, as in
      Haystack ("reflection"); no extra class attribute was added.
    - Haystack choices (pointFunction, pointSubject, pointQuantity,
      coolingProcess, heatingProcess, ductConfig, ahuZoneDelivery,
      pipeFluid, ...) -> enum properties named after the choice. The
      options are the subtypes of the choice's `of` def, or of the choice
      itself, as def names (conjunct options such as chilled-water or
      air-temp kept verbatim); "@type": "@vocab" with a scoped context maps
      them to IRIs. The chosen option is also a marker in hasTag (as in
      Haystack); the enum property is the structured, queryable form.
    - Ref tags -> Relationships: siteRef, spaceRef, equipRef, systemRef,
      weatherStationRef, submeterOf, pointRef, syntheticModelRef, and on
      Equip the 14 flow refs (airRef, chilledWaterRef, hotWaterRef,
      elecRef, ...) whose Haystack tagOn is the "<substance>-input"
      conjunct. Device gets networkRef: Haystack gives it no tagOn but the
      Devices chapter uses it on devices.
    - Str tags with an enum (tz, unit, kind, primaryFunction, curStatus,
      hisMode, hisStatus, writeStatus, evseCableType) -> enums in $defs.
    - Numbers: Haystack Numbers carry a unit; here area is in m²,
      coolingCapacity in kW and geoElevation in m (SI). Point values
      (curVal, writeVal, minVal, maxVal) are in the point's `unit`.
    - geoCoord keeps the Hayson form {lat, lng} ("@type": "@json").
      Site and WeatherStation also get a `location` GeoJSON Point built
      from geoCoord (Smart Data Models addition, not a Haystack tag).
    - The `enum` tag of points is a plain string (comma or newline
      separated names); its dict and Xeto-spec forms are not modelled.

  SOURCE NOTES: the Haystack def IRIs (https://project-haystack.org/def/
  <lib>/4.0.0#<tag>, used by the official Turtle/JSON-LD exports and
  therefore in the contexts) do not dereference (HTTP 404); every
  description also gives the documentation URL
  https://project-haystack.org/doc/lib-<lib>/<tag>, which resolves.
  deviceRef and networkRef have no tagOn in the defs. Choice options
  are nested (pointFunction includes synthetic and its ml/sim/computed),
  so the enums list all levels. The Bravo dataset is tagged with
  Haystack 3 conventions: it writes pointFunction as a Str tag on some
  points, uses spaces as equipment groupings ("Bravo RTUs"), and sets
  geoCounty to "US".

  EXAMPLES: Site, Space, Equip, Point and WeatherStation are REAL records
  of the Project Haystack example site "Bravo" (a hospital in Fort Wayne,
  IN, donated by Sitton and anonymized by Project Haystack; AFL-3.0):
  site @b-0000, space @b-0135, rooftop unit RTU-1 @b-00ac (ahu rtu with
  chilledWaterCooling, hotWaterHeating, singleDuct, vavZone), its supply
  air temperature sensor @b-00c9 and weather station @b-042f. Only the
  non-standard `custom` tags were left out; the site area was converted
  from 78000 ft² to m². Bravo has no system, device or network records,
  so System, Device and Network are SYNTHETIC and linked to Bravo; their
  `source` says so. No personal data.

  DUPLICATION RISK: high, by design of the domain.
    - brick-schema candidate (Point, System, Equipment, sensor classes)
      and realestatecore candidate (Site, Building, Level, Room, Zone,
      Asset) cover the same building concepts; Brick and Haystack are
      being aligned (ASHRAE 223P). Same type names: Site
      (realestatecore, saref4inma), Point and System (brick-schema),
      WeatherStation (saref4agri), Device (saref4ener, gaiax-ontology).
    - Official subjects: dataModel.Building (Building,
      BuildingOperation), dataModel.Device (Device), dataModel.S4BLDG,
      dataModel.S4SYST (System), dataModel.Weather (WeatherObserved).
    Decide before promotion whether Haystack should be a subject of its
    own (to keep the tag model) or mapped onto Building/Device.
