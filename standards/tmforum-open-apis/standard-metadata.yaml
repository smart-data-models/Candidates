  SCOPE AND REPOSITORIES: github.com/tmforum-apis has 97 repositories, 90 of
  them TMF APIs. Included: 86 APIs (38 at v5, 48 at v4 or
  older), 81 of which contribute models; 5 (TMF640, TMF702, TMF730,
  TMF909, TMF910) only re-expose resources defined by another API. Excluded:
    - TMF667_Document: no LICENSE file (licence not granted).
    - TMF123_Template: repository template, not an API.
    - TMF937_OpenGatewayProductUsage: Apache-2.0 but no OpenAPI file in the
      repository (nothing to translate).
    - TMF702-ResourceActivationConfiguration: older, unreleased copy of
      TMF702 (same 51 definitions); TMF702_ResourceActivationManagement
      (release v4.0.0) is used.
    - the 7 non-API repositories (tmf-api-commons, CTK and tooling).
  Version rule: latest GitHub release of each repository (v5 where released,
  else v4); repositories with no release at all (TMF628, 658, 675, 684, 685,
  688, 691, 697, 700, 703, 908, 909, 910, 914) use the default-branch
