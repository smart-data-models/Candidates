title: "SAREF4EHAW (SAREF extension for eHealth / Ageing Well)"
publisher: "ETSI (European Telecommunications Standards Institute) - SmartM2M"
sourceUrl: "https://saref.etsi.org/saref4ehaw/v2.1.1/"
sourceOntologyVersion: "v2.1.1"
normativeReference: "ETSI TS 103 410-8 V2.1.1 (2024-09), SmartM2M; Extension to SAREF; Part 8: eHealth/Ageing-well Domain -- https://www.etsi.org/deliver/etsi_ts/103400_103499/10341008/02.01.01_60/ts_10341008v020101p.pdf"
domains:
  - eHealth
  - ActiveAssistedLiving
  - AgeingWell
  - SmartCities
description: >
  SAREF4EHAW extends the SAREF (Smart Applications REFerence) core ontology
  to the eHealth and Ageing-Well / Active Assisted Living (AAL) vertical. It
  models the actors, devices and networks involved in remote health
  monitoring and ageing-well use cases: health actors (patients, users,
  caregivers, helpers, responsible parties) equipped with a Body Area
  Network (BAN) of health devices (sensors, actuators, wearables) connected
  through a BAN hub, communicating over communication
  interfaces/networks/protocols, and producing observation-collection
  executions (e.g. ECG recording sessions, SpO2/heart-rate/body-temperature
  readings). It reuses SAREF core (Device, Sensor, Actuator, Function,
  Command, Property, Service, State/StateValue), SAREF4SYST (System,
  Connection, ConnectionPoint) and SAREF4WEAR (WearableDevice) rather than
  re-defining them. This candidate translates the full set of SAREF4EHAW-own
  classes (21 classes) into one candidate model per class under models/.
