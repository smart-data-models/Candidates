description: >
  The Allotrope Foundation Ontologies (AFO) are the controlled vocabulary
  and semantic model of the Allotrope Framework for analytical laboratory
  data in the pharmaceutical, biotech and chemical industries. AFO is built
  on the Basic Formal Ontology (BFO 2.0) and reuses OBO terms (RO, IAO, OBI,
  CHMO); it describes laboratory equipment (instruments, detectors,
  containers), materials and samples, the roles they play (sample,
  standard, analyte, solvent...), analytical processes (chromatography,
  spectroscopy, weighing, titration...), results and their quantity values,
  with units from QUDT and an Allotrope QUDT extension. It is the vocabulary
  behind the Allotrope Data Format (ADF) and the Allotrope Simple Model
  (ASM) JSON schemas. Release REC/2026/09 loads as about 28,000 triples:
  3,125 classes (about 2,400 in the Allotrope namespaces), 281 object
  properties and 24 datatype properties.
