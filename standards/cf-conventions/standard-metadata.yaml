description: >
  The CF (Climate and Forecast) Metadata Conventions define the metadata
  that make netCDF datasets self-describing: global attributes (Conventions,
  title, institution, source, history, references, comment, featureType),
  variable attributes (standard_name, long_name, units, cell_methods,
  coordinates, axis, positive, calendar, valid ranges, _FillValue, flags,
  grid_mapping, ...), coordinate systems and grid mappings, cell bounds and
  methods, discrete sampling geometries (point, timeSeries, trajectory,
  profile, timeSeriesProfile, trajectoryProfile), compression and
  quantization. Its Standard Name Table (about 5,100 names) is the common
  vocabulary for geophysical quantities in climate, weather, ocean and
  Earth-observation data (CMIP, Copernicus, NOAA, ESA, ...).
